# GitHub Actions updates. Minor and patch bumps arrive as one grouped PR a week; major
# versions are ignored, and Dependabot security alerts still fire for any version.
# Actions is the only ecosystem here: hub/package.json has no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
