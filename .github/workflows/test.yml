name: Tests

# The 66 Node tests in Hub/ existed for weeks with nothing running them. This is that.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight. Not on main, where every
# commit's result is worth keeping.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.17 is the floor the README and Hub/package.json both claim, and nothing has
        # ever verified it. 22 is what the demo deploy runs on.
        node: ['18.17', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile and no dependencies — npm ci would have nothing to do.
      - run: npm test
        working-directory: Hub

  demo-build:
    # The demo build is an integration test as much as a publishing step: it runs the real
    # scanner over a fixture and asserts the exact string literals it rewrites in
    # index.html are still there, so an interface change that moves them fails here rather
    # than shipping a demo that half works. Node 22 to match the deploy job.
    name: demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Warns, never fails: rebuilding needs Chrome + Archify, which CI doesn't have, and the
      # homepage copies live in project-hub-site, which CI has no clone of (--no-site). A
      # warning means code cited by docs/diagrams/hub-architecture.json changed since its
      # pinned commit; docs/diagrams/README.md says how to update it.
      - name: Diagram drift
        run: node scripts/build-diagram.mjs --hook --no-site | sed 's/^ISSUE:/::warning title=Diagram drift::ISSUE:/'
      - run: node Demo/build-demo.mjs
      # A capture that suddenly holds nothing is the failure this would otherwise miss:
      # the build is happy to write an empty site if the fixture stops being found.
      - name: Check the capture is not empty
        run: |
          test -s Demo/site/index.html
          test -s Demo/site/api/manifest.json
          captured=$(node -p "Object.keys(require('./Demo/site/api/manifest.json')).length")
          echo "captured $captured API responses"
          test "$captured" -gt 100

  scaffold-copy:
    # Skills/project-hub-scaffold/ is a travel copy; agent-skills' main is canonical. A
    # feature PR here that updates only this copy used to drift silently (P2-12), so the
    # copy must match canonical exactly, line endings aside. On a failure, make the same
    # edit in agent-skills/Skills/Core/Web/project-hub-scaffold/ and copy it back here.
    name: scaffold copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-automation-tools/agent-skills
          ref: main
          path: _agent-skills
          sparse-checkout: Skills/Core/Web/project-hub-scaffold
      - run: diff -r --strip-trailing-cr _agent-skills/Skills/Core/Web/project-hub-scaffold Skills/project-hub-scaffold
