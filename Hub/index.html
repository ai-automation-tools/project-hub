<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title>
<link rel="icon" href="%FAVICON%">
<!-- Applied before first paint so a non-default scheme doesn't flash midnight. -->
<script nonce="%NONCE%">try{document.documentElement.dataset.theme=localStorage.getItem('hub.theme')||'midnight'}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --zoom:1.15;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
}
/* ── color schemes ──────────────────────────────────────────
   Every surface, text and accent color in the sheet comes from
   one of these blocks. Adding a scheme = copy a block, change
   the values, add an <option> to #theme. Nothing else. */
html,html[data-theme="midnight"]{           /* default — terminal green on near-black */
  --bg:#0a0c0e; --panel:#0c0f12; --card:#0e1114; --card-hi:#12161a; --row-hi:#14181d;
  --sel:#151b21; --sunken:#080a0c;
  --line:#22272e; --line-soft:#1a1f25; --line-faint:#14181d;
  --fg:#dbe1e8; --fg-hi:#e7ecf1; --fg-max:#f0f4f8; --fg-mid:#a7b0ba;
  --dim:#79838f; --dimmer:#4e5762; --dimmest:#3c444e;
  --green:#5fe3a1; --green-hi:#8ff0c0; --green-line:#2f6b52;
  --orange:#e0a458; --purple:#b48ce8; --blue:#6aa9f0; --red:#e06c75; --magenta:#d16ba5;
  --accent-bg:#0b1512; --accent-line:#1e3a2c; --blue-bg:#0e1620; --blue-line:#1e3550;
}
html[data-theme="oxide"]{                   /* warm dark — amber on brown-black */
  --bg:#0f0d0a; --panel:#13100c; --card:#17130e; --card-hi:#1c1711; --row-hi:#201a13;
  --sel:#241d15; --sunken:#0a0806;
  --line:#332a20; --line-soft:#28211a; --line-faint:#1e1913;
  --fg:#e8ded0; --fg-hi:#f2e9dc; --fg-max:#fbf4ea; --fg-mid:#bcae9b;
  --dim:#8e806d; --dimmer:#645848; --dimmest:#4c4234;
  --green:#e8b04b; --green-hi:#f7cb78; --green-line:#6d5424;
  --orange:#e07b4a; --purple:#c99ae0; --blue:#7fb3a8; --red:#e0605a; --magenta:#d98ba0;
  --accent-bg:#191207; --accent-line:#3d2f13; --blue-bg:#0d1615; --blue-line:#26403c;
}
html[data-theme="cobalt"]{                  /* cool dark — cyan/blue on deep navy */
  --bg:#080d14; --panel:#0a1018; --card:#0c131d; --card-hi:#101825; --row-hi:#131c2a;
  --sel:#152032; --sunken:#060a10;
  --line:#1e2c40; --line-soft:#182334; --line-faint:#121b28;
  --fg:#d4e0ef; --fg-hi:#e3ecf7; --fg-max:#f1f6fc; --fg-mid:#9fb2c9;
  --dim:#70859e; --dimmer:#4a5c73; --dimmest:#38485c;
  --green:#4fd6e8; --green-hi:#84e8f5; --green-line:#256b78;
  --orange:#f0b45c; --purple:#a99bf5; --blue:#5b9df5; --red:#f0707f; --magenta:#e07ac4;
  --accent-bg:#07171c; --accent-line:#163b45; --blue-bg:#0a1424; --blue-line:#1d3560;
}
html[data-theme="paper"]{                   /* light — ink on warm white */
  --bg:#f7f6f3; --panel:#efeeea; --card:#ffffff; --card-hi:#f4f3ef; --row-hi:#e8e7e1;
  --sel:#e0e6e1; --sunken:#f0efeb;
  --line:#d4d2cb; --line-soft:#e0ded7; --line-faint:#e9e7e1;
  --fg:#2b2f33; --fg-hi:#1c2024; --fg-max:#0f1215; --fg-mid:#4d545b;
  --dim:#6d757d; --dimmer:#8d959d; --dimmest:#a8afb6;
  --green:#0f7a4e; --green-hi:#0b5c3a; --green-line:#9dcbb4;
  --orange:#a2670c; --purple:#6d4bb0; --blue:#1a5fb4; --red:#b3261e; --magenta:#a3358a;
  --accent-bg:#e8f4ee; --accent-line:#bcded0; --blue-bg:#e8f0fa; --blue-line:#c1d5ee;
}
html[data-theme="plum"]{                    /* dark — violet/magenta on aubergine */
  --bg:#0d0912; --panel:#110c17; --card:#150f1c; --card-hi:#1a1322; --row-hi:#1f1728;
  --sel:#241a2f; --sunken:#090610;
  --line:#2e2340; --line-soft:#241b32; --line-faint:#1b1426;
  --fg:#e2d9ee; --fg-hi:#ede6f6; --fg-max:#f6f2fb; --fg-mid:#b0a2c4;
  --dim:#8375a0; --dimmer:#5a4d75; --dimmest:#463b5c;
  --green:#c48cf0; --green-hi:#dcb3fa; --green-line:#5c3b7d;
  --orange:#f0a06c; --purple:#9b8cf5; --blue:#6fa8e8; --red:#ec6f8e; --magenta:#f07ad0;
  --accent-bg:#160e1f; --accent-line:#3a2551; --blue-bg:#0d1420; --blue-line:#24406b;
}
html[data-theme="nord"]{                    /* dark — muted arctic blue-grey */
  --bg:#20242c; --panel:#252a33; --card:#2a303a; --card-hi:#313843; --row-hi:#373f4b;
  --sel:#3b4655; --sunken:#1a1e25;
  --line:#3c4350; --line-soft:#333a45; --line-faint:#2b313b;
  --fg:#d8dee9; --fg-hi:#e5e9f0; --fg-max:#eceff4; --fg-mid:#a8b1c0;
  --dim:#8993a4; --dimmer:#68717f; --dimmest:#535c69;
  --green:#8fbcbb; --green-hi:#a9d3d2; --green-line:#4b6a6a;
  --orange:#d08770; --purple:#b48ead; --blue:#81a1c1; --red:#bf616a; --magenta:#c98cb8;
  --accent-bg:#243033; --accent-line:#3d5654; --blue-bg:#232c38; --blue-line:#3d5170;
}
html[data-theme="sepia"]{                   /* light — brown ink on aged cream */
  --bg:#f4ecdd; --panel:#ece2d0; --card:#fbf5e9; --card-hi:#f2e9d8; --row-hi:#e6dac4;
  --sel:#e0d3b8; --sunken:#ebe1cf;
  --line:#d2c4a8; --line-soft:#ded2ba; --line-faint:#e7dcc7;
  --fg:#3b3227; --fg-hi:#2a231a; --fg-max:#1a1510; --fg-mid:#5c5142;
  --dim:#7c705d; --dimmer:#9a8e79; --dimmest:#b3a792;
  --green:#5c6b2f; --green-hi:#44521f; --green-line:#b6c090;
  --orange:#a05a12; --purple:#6b4a8c; --blue:#2a5f8f; --red:#a33326; --magenta:#93356f;
  --accent-bg:#eaeed6; --accent-line:#c8d0a6; --blue-bg:#e4ecf3; --blue-line:#b6cadd;
}
html[data-theme="mono"]{                    /* dark — pure greyscale, no hue */
  --bg:#0b0b0b; --panel:#101010; --card:#141414; --card-hi:#1a1a1a; --row-hi:#1f1f1f;
  --sel:#262626; --sunken:#070707;
  --line:#2b2b2b; --line-soft:#212121; --line-faint:#191919;
  --fg:#dcdcdc; --fg-hi:#ebebeb; --fg-max:#f7f7f7; --fg-mid:#a6a6a6;
  --dim:#7d7d7d; --dimmer:#565656; --dimmest:#414141;
  --green:#e0e0e0; --green-hi:#ffffff; --green-line:#4d4d4d;
  --orange:#b8b8b8; --purple:#c9c9c9; --blue:#9e9e9e; --red:#d4d4d4; --magenta:#aeaeae;
  --accent-bg:#171717; --accent-line:#383838; --blue-bg:#131313; --blue-line:#303030;
}
*{box-sizing:border-box}
/* Everything in this sheet is sized in px. Root zoom scales the whole UI from one
   knob (--zoom) instead of touching every value. Chrome does NOT shrink the initial
   containing block to match, so 100vh comes back 15% too tall — #app divides it out. */
html{zoom:var(--zoom)}
html,body{margin:0;padding:0;height:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--fg);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--green);text-decoration:none}
a:hover{color:var(--green-hi);text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-thumb:hover{background:var(--dimmest)}
input::placeholder{color:var(--dimmer)}
.mono{font-family:var(--mono)}
.cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer)}

#app{display:flex;height:calc(100vh / var(--zoom));width:100%;overflow:hidden}

/* ── explorer ───────────────────────────────────────────── */
/* flex:0 0 auto so `width` alone drives the panel — one property to animate, and
   an interrupted transition can't leave basis and width disagreeing. */
aside{position:relative;width:var(--sbw,284px);flex:0 0 auto;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;transition:width .16s ease}
#app.dragging aside{transition:none}
/* collapsed rail — the panel folds down to just the ex-head strip (so #sidetoggle,
   the control that reopens it, stays reachable) instead of vanishing entirely. */
#app.rail aside{width:34px}
#app.rail #tree,#app.rail .ex-foot{display:none}
#app.rail .glyph,#app.rail .ex-title,#app.rail #collapse{display:none}
#app.rail .ex-head{justify-content:center;padding:11px 0}
/* drag handle — straddles the border so a couple stray px on either side still grabs it. */
#sidedrag{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5}
#sidedrag:hover,#app.dragging #sidedrag{background:var(--green-line)}
#app.rail #sidedrag{display:none}
#sidetoggle{font-family:var(--mono);font-size:12px;line-height:1;color:var(--dimmer);
  border:1px solid var(--line);padding:2px 6px;cursor:pointer;user-select:none}
#sidetoggle:hover{color:var(--green);border-color:var(--green-line)}
#sidetoggle::before{content:"«"}
#app.rail #sidetoggle::before{content:"»"}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
/* history back/forward — history.back()/forward() work with no button at all once a
   hash exists, but nothing on the page said so. These just make the existing mechanism
   reachable without a mouse over the browser's own chrome (hidden in some embeds, e.g.
   VS Code's Simple Browser tab toolbar sits above the page, easy to miss). */
.navbtns{display:flex;gap:3px}
.navbtn{font-size:14px;line-height:1;padding:4px 8px}
.ex-head{padding:11px 12px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.glyph{width:17px;height:17px;border:1px solid var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--green);font-weight:600}
.ex-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);flex:1}
.ex-act{font-family:var(--mono);font-size:10px;color:var(--dimmer);cursor:pointer}
.ex-act:hover{color:var(--green)}
#tree{flex:1;overflow-y:auto;padding:6px 0 16px}
.node{display:flex;align-items:center;gap:6px;height:25px;padding-right:10px;cursor:pointer;border-left:2px solid transparent;user-select:none}
.node:hover{background:var(--row-hi)}
.node.sel{background:var(--sel);border-left-color:var(--green)}
/* The chevron is its own hit target — sized for a mouse, not for decoration. */
.chev{font-family:var(--mono);font-size:13px;width:15px;flex:0 0 15px;height:100%;display:flex;
  align-items:center;justify-content:center;margin-left:-3px;color:var(--dim)}
.chev[data-toggle]:hover{color:var(--green)}
.dot{width:7px;height:7px;flex:0 0 7px}
.dot.round{border-radius:50%}
.nm{font-family:var(--mono);font-size:11.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.node.sel .nm{color:var(--fg-max)}
.bdg{font-family:var(--mono);font-size:9.5px;color:var(--dimmest)}
.ex-foot{border-top:1px solid var(--line-soft);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dimmer)}
#live{color:var(--green);cursor:pointer;user-select:none}
#live:hover{text-decoration:underline}
#live.stale{color:var(--orange)}
/* scan status detail (P7-16) -- a floating layer, dismissed like the context menu */
.ctxmenu.status{width:340px;max-width:calc(100vw - 16px);max-height:70vh;overflow-y:auto;padding:10px 12px;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);cursor:default}
.ctxmenu.status h3{margin:0 0 6px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);font-weight:500}
.ctxmenu.status h3:not(:first-child){margin-top:12px;padding-top:9px;border-top:1px solid var(--line-soft)}
.ctxmenu.status .kv{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.ctxmenu.status .kv b{font-weight:500;color:var(--fg-hi)}
.ctxmenu.status .warn b{color:var(--orange)}
.ctxmenu.status .err{color:var(--dimmer);padding:2px 0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxmenu.status .err:hover{color:var(--green)}
.ctxmenu.status p{margin:4px 0 0;line-height:1.5;white-space:normal}

/* Right-click menu on a tree row. Reaches the same destinations as the header
   action buttons (copy, open, open in VS Code) without selecting the row first,
   plus "open folder", which resolves to the row's parent when the row is a file. */
.ctxmenu{position:fixed;z-index:60;min-width:172px;background:var(--card);border:1px solid var(--line);
  box-shadow:0 6px 20px rgba(0,0,0,.4);padding:4px}
.ctxmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--fg);
  font-family:var(--mono);font-size:11.5px;padding:6px 9px;cursor:pointer}
.ctxmenu button:hover{background:var(--row-hi);color:var(--green)}
.ctxmenu button:disabled{color:var(--dimmest);cursor:default}
.ctxmenu button:disabled:hover{background:none;color:var(--dimmest)}
.ctxmenu hr{border:none;border-top:1px solid var(--line-soft);margin:4px 0}

/* ── main ───────────────────────────────────────────────── */
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
header{height:42px;flex:0 0 42px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;padding:0 16px}
#crumbs{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim);min-width:0;overflow:hidden}
#crumbs span[data-go]{cursor:pointer;white-space:nowrap}
#crumbs span[data-go]:hover{color:var(--green)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:4px 8px;width:290px}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:var(--mono);font-size:11.5px}
.kbd{font-family:var(--mono);font-size:9.5px;color:var(--dimmest);border:1px solid var(--line);padding:1px 4px}
.btn{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);padding:4px 9px;cursor:pointer;background:none}
.btn:hover{border-color:var(--green-line);color:var(--green)}
.btn.solid{color:var(--bg);background:var(--green);border-color:var(--green);font-weight:500}
.btn.solid:hover{background:var(--green-hi);color:var(--bg)}
select.btn{appearance:none;padding-right:9px}
select.btn option{background:var(--panel);color:var(--fg)}
#view{flex:1;overflow-y:auto}
.page{padding:22px 24px 48px;max-width:1200px;margin-inline:auto;width:100%;display:flex;flex-direction:column;gap:18px}
h1.t{margin:0;font-family:var(--mono);font-size:19px;font-weight:600;color:var(--fg-max);letter-spacing:-.02em}
h2.sec{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.path{font-family:var(--mono);font-size:11px;color:var(--dimmer);word-break:break-all}
.lede{margin:0;font-size:12.5px;color:var(--fg-mid);max-width:720px;line-height:1.6;text-wrap:pretty}
.row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.grow{flex:1}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border:1px solid var(--line)}
.tag.br{color:var(--blue);border-color:var(--blue-line);background:var(--blue-bg)}
.tag.cli{color:var(--green);border-color:var(--accent-line);background:var(--accent-bg)}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.stat{background:var(--card);padding:11px 13px;display:flex;flex-direction:column;gap:4px}
/* Stat tiles that jump to a section — the arrow only shows on hover so the strip
   stays a readout first and a nav second. */
.stat.jump{cursor:pointer}
.stat.jump:hover{background:var(--card-hi)}
.stat.jump .cap::after{content:' \2193';opacity:0;color:var(--dim)}
.stat.jump:hover .cap::after{opacity:1}
/* Brief tint on the heading you were sent to, so the jump is legible on a long page. */
@keyframes secflash{from{color:var(--fg-max)}to{color:var(--dim)}}
h2.sec.flash{animation:secflash 1.4s ease-out}
.stat b{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em}
.stat i{font-style:normal;font-size:10.5px;color:var(--dimmer)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:10px}
.cards.two{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{border:1px solid var(--line);background:var(--card);padding:12px 13px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.card:hover{border-color:var(--green-line);background:var(--card-hi)}
.card .hd{display:flex;align-items:center;gap:8px}
.card .hd b{font-family:var(--mono);font-size:12.5px;font-weight:400;color:var(--fg-hi);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .hd em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer)}
.card p{margin:0;font-size:11.5px;line-height:1.5;color:var(--dim);text-wrap:pretty;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);border-top:1px solid var(--line-soft);padding-top:8px}
/* image thumbnails (P7-13) -- native lazy loading, so a folder of two thousand photos
   fetches only what is on screen. ponytail: the browser downscales the full file; a real
   thumbnail cache would need an image decoder, which this zero-dependency server has not
   got. Revisit only if a folder of very large originals actually feels slow. */
/* contain, not cover: these are as often icons and diagrams as photos, and a thumbnail
   that crops the subject out of frame is worse than one with space around it. */
.card .thumb{display:block;width:100%;height:104px;object-fit:contain;padding:6px;box-sizing:border-box;background:var(--sunken);
  border:1px solid var(--line-soft)}
/* image viewer */
.imgwrap{display:flex;justify-content:center;align-items:flex-start;padding:10px;overflow:auto;max-height:78vh}
.imgwrap.fit{overflow:hidden}
.imgwrap img{display:block}
.imgwrap.fit img{max-width:100%;max-height:76vh;object-fit:contain}
.imgbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.imgbar .dims{font-family:var(--mono);font-size:10px;color:var(--dimmer)}

/* repo table filters — see viewOverview */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  padding:2px 8px;cursor:pointer;user-select:none;white-space:nowrap}
.fchip:hover{border-color:var(--green-line);color:var(--green)}
.fchip.on{color:var(--green);border-color:var(--green-line);background:var(--accent-bg)}
.thead .sortable{cursor:pointer;user-select:none}
.thead .sortable:hover{color:var(--green)}

/* repo table */
.thead,.trow{display:grid;grid-template-columns:1.5fr .8fr .7fr .7fr 1.6fr;gap:14px;align-items:center;padding:7px 12px}
.thead{border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}
.trow{border:1px solid var(--line-soft);border-top:none;background:var(--card);cursor:pointer}
.trow:hover{background:var(--row-hi)}
.trow .n{display:flex;align-items:center;gap:8px;min-width:0}
.trow .n span:last-child{font-family:var(--mono);font-size:11.5px;color:var(--fg-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .m{font-family:var(--mono);font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .c{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* folder list view (P7-09) -- same rows, four columns of its own */
.flist .thead,.flist .trow{grid-template-columns:2.2fr .8fr .9fr .7fr}
.flist .trow .s{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist .thead .s{text-align:right}
.viewtoggle{display:flex;gap:0}
.viewtoggle .btn{border-radius:0}
.viewtoggle .btn.on{color:var(--green);border-color:var(--green-line)}
.pill{width:5px;height:5px;border-radius:50%;flex:0 0 5px}

/* detail layout */
.split{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--card)}
.panel>.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line-soft);background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--dim)}
.panel>.ph em{font-style:normal;font-size:10px;color:var(--dimmer)}
.box{border:1px solid var(--line);background:var(--card);padding:12px}
.box .cap{margin-bottom:9px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:3px 0}
.kv span:first-child{font-size:11.5px;color:var(--dim)}
.kv span:last-child{font-family:var(--mono);font-size:11px;color:var(--fg);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linklist{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px}
.linklist div{cursor:pointer;color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linklist div:hover{color:var(--green-hi)}
.filelist{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px}
.filelist div{display:flex;align-items:center;gap:7px;color:var(--dim);cursor:pointer}
.filelist div:hover{color:var(--green)}
.filelist i{font-style:normal;color:var(--dimmest);width:8px}
.filelist .more{margin-top:7px;padding-top:7px;border-top:1px solid var(--line-soft);color:var(--dimmer)}
.filelist .more:hover{color:var(--blue)}
.stack{display:flex;flex-direction:column;gap:10px}

/* artifact bucket columns -- a masonry via CSS columns, not a grid: panels flow down
   each column in source order and only push what's *below them in that same column*,
   so expanding Skills doesn't strand Commands/Hooks in a tall, mostly-empty grid row. */
.buckets{columns:300px 3;column-gap:12px}
.buckets .panel{display:inline-block;vertical-align:top;width:100%;break-inside:avoid;margin-bottom:12px}
.bucket .ph b{font-weight:400;color:var(--fg);flex:1}
.bitem{padding:8px 12px;border-bottom:1px solid var(--line-faint);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.bitem:hover{background:var(--row-hi)}
.bitem .bn{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem p{margin:0;font-size:11px;line-height:1.4;color:var(--dim);text-wrap:pretty;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:5px 9px;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--fg)}
.chip:hover{border-color:var(--green-line)}
.chip em{font-style:normal;font-size:9.5px;color:var(--dimmer)}

/* Keyboard focus. Until 2026-08-31 nothing here was focusable and nothing showed a ring,
   so a keyboard user had no way in and no way to tell where they were. */
:focus-visible{outline:2px solid var(--green);outline-offset:-2px;border-radius:1px}
.node:focus-visible{outline-offset:-2px}
.hit.cur{border-color:var(--green-line);background:var(--card-hi)}
mark{background:transparent;color:var(--green-hi);font-weight:600}

/* collapsible sections — native <details>, so keyboard and find-in-page come free */
.fold{display:flex;flex-direction:column}
.fold>summary,.panel>summary.ph{cursor:pointer;list-style:none;user-select:none}
.fold>summary::-webkit-details-marker,.panel>summary.ph::-webkit-details-marker{display:none}
.fold>summary{display:flex;align-items:baseline;gap:8px}
.fold>summary>:last-child{flex:1;min-width:0}
.fold[open]>summary{margin-bottom:9px}
.fold>summary:hover .fchev,.panel>summary.ph:hover .fchev{color:var(--green)}
.foldbody{display:flex;flex-direction:column;gap:9px}
/* Author display rules (.foldbody, .bitem) outrank the UA rule that hides a closed
   <details> body, so restate it — without this, folding hides nothing. */
details:not([open])>:not(summary){display:none}
/* One glyph, rotated — a text swap would need the two chevron sets kept in sync. */
.fchev{font-family:var(--mono);font-size:10px;line-height:1;color:var(--dimmer);
  transition:transform .12s ease;display:inline-block}
details[open]>summary .fchev{transform:rotate(90deg)}
.panel:not([open])>summary.ph{border-bottom:none}

/* markdown */
.md{padding:16px 20px;font-size:calc(12.8px * var(--read-scale,1));line-height:1.65;color:var(--fg-mid)}
/* Reader tools (P7-12). Width is a max on the prose, not the panel, so tables and code
   blocks keep their own overflow behaviour and the panel chrome stays full width. */
.md>*{max-width:var(--read-width,none)}
.md pre.code{position:relative}
.md pre.code .copycode{position:absolute;top:5px;right:5px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);background:var(--panel);
  border:1px solid var(--line);padding:2px 6px;cursor:pointer;opacity:0;transition:opacity .12s}
.md pre.code:hover .copycode,.md pre.code .copycode:focus{opacity:1}
.md pre.code .copycode:hover{color:var(--green);border-color:var(--green-line)}
.outline{padding:8px 12px 10px;border-bottom:1px solid var(--line-soft);background:var(--sunken);
  max-height:34vh;overflow-y:auto}
.outline a{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);
  padding:2px 0;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline a:hover{color:var(--green)}
.outline a.h3{padding-left:14px;color:var(--dimmer)}
.outline a.h4{padding-left:28px;color:var(--dimmer);font-size:10.5px}
.outline .empty{padding:0}
.readerbtns{display:flex;align-items:center;gap:4px}
.md h1,.md h2,.md h3,.md h4{color:var(--fg-max);letter-spacing:-.01em;margin:20px 0 8px;line-height:1.3}
.md h1{font-size:17px}.md h2{font-size:15px}.md h3{font-size:13.5px}.md h4{font-size:12.5px;color:var(--fg-hi)}
.md h1:first-child,.md h2:first-child{margin-top:0}
.md p{margin:0 0 10px;text-wrap:pretty}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin:3px 0}
.md hr{border:none;border-top:1px solid var(--line-soft);margin:16px 0}
.md code{font-family:var(--mono);font-size:11.5px;color:var(--green);background:var(--accent-bg);border:1px solid var(--accent-line);padding:1px 4px}
.md pre.code{background:var(--sunken);border:1px solid var(--line-soft);padding:10px 12px;overflow-x:auto;margin:0 0 12px}
.md pre.code code{font-size:11.5px;color:var(--fg-mid);background:none;border:none;padding:0;white-space:pre}
.md blockquote{margin:0 0 10px;padding:2px 0 2px 12px;border-left:2px solid var(--line);color:var(--dim)}
.md .alert{margin:0 0 12px;padding:9px 13px;background:var(--sunken);border-left:3px solid var(--dim)}
.md .alert p{margin:0 0 6px}
.md .alert p:last-child{margin-bottom:0}
.md .alert-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;font-weight:600}
.md .alert-note{border-left-color:var(--blue)}.md .alert-note .alert-label{color:var(--blue)}
.md .alert-tip{border-left-color:var(--green)}.md .alert-tip .alert-label{color:var(--green)}
.md .alert-important{border-left-color:var(--purple)}.md .alert-important .alert-label{color:var(--purple)}
.md .alert-warning{border-left-color:var(--orange)}.md .alert-warning .alert-label{color:var(--orange)}
.md .alert-caution{border-left-color:var(--red)}.md .alert-caution .alert-label{color:var(--red)}
.md pre.code .tok-k{color:var(--purple)}
.md pre.code .tok-s{color:var(--green)}
.md pre.code .tok-c{color:var(--dimmer);font-style:italic}
.md pre.code .tok-n{color:var(--blue)}
.md table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:11.5px;display:block;overflow-x:auto}
.md td{border:1px solid var(--line-soft);padding:6px 9px;vertical-align:top}
.md tr:first-child td{background:var(--panel);color:var(--fg-hi);font-weight:500}
.md .imgref{font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}
.md img{max-width:100%;height:auto;vertical-align:middle}
.md p[align="center"],.md div[align="center"]{text-align:center}
.md a[data-md-link]{color:var(--blue)}

/* search results */
.hit{display:grid;grid-template-columns:96px 240px 1fr;gap:14px;align-items:center;padding:8px 11px;border:1px solid var(--line-soft);background:var(--card);cursor:pointer;margin-bottom:1px}
.hit:hover{border-color:var(--green-line);background:var(--card-hi)}
.hit .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.hit .n{font-family:var(--mono);font-size:11.5px;color:var(--fg-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .d{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{font-family:var(--mono);font-size:11px;color:var(--dimmer);padding:4px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--green-line);color:var(--green);font-family:var(--mono);font-size:11px;padding:7px 14px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:50}
#toast.on{opacity:1}

/* Print: the document, and nothing else. Everything here is chrome that exists to get
   you to the document, so on paper it is all noise. */
@media print{
  aside,header,#connection,#toast,.ctxmenu,.ph,.viewtoggle,#sidedrag{display:none!important}
  #app{display:block;height:auto}
  main{overflow:visible}
  #view{overflow:visible;padding:0}
  .page{padding:0;gap:12px}
  .panel{border:none;background:none}
  .md{padding:0;color:#000;font-size:11pt;line-height:1.5}
  .md>*{max-width:none}
  .md h1,.md h2,.md h3,.md h4{color:#000;break-after:avoid}
  .md h1{font-size:18pt}.md h2{font-size:14pt}.md h3{font-size:12pt}.md h4{font-size:11pt}
  .md a{color:#000;text-decoration:underline}
  .md pre.code,.md td{background:#fff;border:1px solid #999;color:#000;break-inside:avoid}
  .md pre.code code{color:#000}
  .md pre.code .copycode,.outline{display:none!important}
  .md img{max-width:100%}
  .row .btn,.row .tag{display:none}
  h1.t{color:#000;font-size:20pt}
  .path{color:#444}
}

/* bookmarks + recents — collapsed by default, so the startup sidebar stays as quiet
   as it was before they existed. Rows deliberately reuse the tree's .node metrics. */
#pins:empty{display:none}
.pinsec{border-bottom:1px solid var(--line-soft)}
.pinhead{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;user-select:none;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pinhead:hover{color:var(--green)}
.pinhead .chev{width:12px;flex:0 0 12px;font-size:11px;margin:0}
.pinhead .n{flex:1}
.pinhead .c{color:var(--dimmer);letter-spacing:0}
.pinlist{padding-bottom:5px}
.pin{display:flex;align-items:center;gap:6px;height:23px;padding:0 8px 0 20px;cursor:pointer;
  border-left:2px solid transparent;user-select:none}
.pin:hover{background:var(--row-hi)}
.pin.sel{background:var(--sel);border-left-color:var(--green)}
.pin .nm{font-family:var(--mono);font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.pin .ctx{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);flex:0 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.pin.gone .ctx{opacity:.6}
.pin.gone .nm{color:var(--dimmer);text-decoration:line-through}
.pin .x{font-family:var(--mono);font-size:11px;color:var(--dimmer);padding:0 3px;visibility:hidden}
.pin:hover .x,.pin:focus-within .x{visibility:visible}
.pin .x:hover{color:var(--red)}
.pin.drop{border-top:2px solid var(--green)}
.pin.dragging{opacity:.4}
.pinnote{font-family:var(--mono);font-size:10px;color:var(--dimmer);padding:2px 10px 5px 20px}
.pinnote button{font:inherit;color:var(--blue);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
.pinempty{font-family:var(--mono);font-size:10px;color:var(--dimmer);padding:2px 10px 6px 20px}
#app.rail #pins{display:none}
.btn.star.on{color:var(--orange);border-color:var(--orange)}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="ex-head">
      <div class="glyph">/</div>
      <div class="ex-title">Explorer</div>
      <div class="ex-act" id="collapse">collapse all</div>
      <div id="sidetoggle" title="Show/hide sidebar (Ctrl+B)"></div>
    </div>
    <div id="pins"></div>
    <div id="tree"></div>
    <div class="ex-foot">
      <span id="foot-file">index.html</span>
      <span id="live">● connecting</span>
    </div>
    <div id="sidedrag" title="Drag to resize"></div>
  </aside>
  <main>
    <header>
      <div class="navbtns">
        <button class="btn navbtn" id="navback" title="Back (Alt+←)" aria-label="Back">‹</button>
        <button class="btn navbtn" id="navfwd" title="Forward (Alt+→)" aria-label="Forward">›</button>
      </div>
      <div id="crumbs"></div>
      <div class="grow"></div>
      <div class="search">
        <span class="mono" style="font-size:11px;color:var(--dimmer)">⌕</span>
        <input id="q" placeholder="Search repos, skills, commands, agents, docs" autocomplete="off"
          role="combobox" aria-autocomplete="list" aria-expanded="false"
          aria-controls="search-results pictures-results"
          aria-label="Search the workspace. Prefix with a kind to narrow, for example skill: or repo:">
        <span class="kbd">Ctrl+K</span>
      </div>
      <select class="btn" id="theme" title="Color scheme">
        <option value="midnight">◐ midnight</option>
        <option value="oxide">◐ oxide</option>
        <option value="cobalt">◐ cobalt</option>
        <option value="paper">◐ paper</option>
        <option value="plum">◐ plum</option>
        <option value="nord">◐ nord</option>
        <option value="sepia">◐ sepia</option>
        <option value="mono">◐ mono</option>
      </select>
      <button class="btn" id="rescan">↻ rescan</button>
    </header>
    <div id="connection" role="status" hidden style="padding:8px 16px;border-bottom:1px solid var(--orange)"><span></span> <button class="btn" id="retry">Retry</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" nonce="%NONCE%">
import { routeHash, parseRoute, searchHash, parseSearch, documentTarget, markdownLink, includeInSearch,
  BOOKMARKS_KEY, RECENT_KEY, parseList, isBookmarked, toggleBookmark, renameBookmark, moveBookmark,
  pushRecent, resolveBookmarks } from '/navigation.mjs';
import { PictureNodes } from '/pictures-client.mjs';
const pictureNodes = new PictureNodes();
const pictureRequests = new Map();
const pictureSearches = new Map();
let navigationRequest = 0;
let requestedNavigation = null;
let pictureGeneration = 0;
const TINT = {
  root:'var(--green)', docroot:'var(--red)', section:'var(--magenta)', cli:'var(--green)',
  group:'var(--blue)', repo:'var(--purple)', folder:'var(--blue)',
  skill:'var(--green)', command:'var(--orange)', agent:'var(--purple)', hook:'var(--blue)',
  style:'var(--magenta)', mcp:'var(--magenta)', userroot:'var(--blue)', routine:'var(--red)',
  md:'var(--orange)', config:'var(--blue)', file:'var(--dimmer)', draft:'var(--orange)',
  image:'var(--purple)', html:'var(--orange)', pdf:'var(--red)', projects:'var(--green)',
};
const ROUND = new Set(['root','docroot','userroot','repo','draft','projects']);
// Kinds that are directories on disk, so a listing can mark them with a trailing slash.
// An empty directory arrives with no `children`, so kind is the reliable test. `projects`
// has real children (the mounted project roots) but no filesystem path of its own -- it
// belongs in DIRISH (it acts like a folder) but would break resolveId()/absOf() if
// anything tried to open or copy-path it, which is why it gets its own view instead of
// falling through to the generic viewFolder().
const DIRISH = new Set(['root','docroot','userroot','repo','cli','group','section','folder','draft','projects']);
const ENTITY = new Set(['skill','command','agent','hook','style','routine']);
const KIND_LABEL = { cli:'CLI', repo:'REPO', group:'GROUP', section:'SECTION', folder:'FOLDER',
  skill:'SKILL', command:'COMMAND', agent:'SUB-AGENT', hook:'HOOK', style:'OUTPUT STYLE',
  routine:'ROUTINE', draft:'DRAFT', projects:'PROJECTS',
  mcp:'MCP', userroot:'USER CLIS', md:'DOC', config:'CONFIG', file:'FILE', image:'IMAGE', html:'HTML', pdf:'PDF' };

const S = { data:null, byId:new Map(), parent:new Map(), index:[], sel:null, open:new Set(), query:'', sig:null,
  repoSort:{ key:'name', dir:1 }, repoFilter:null,   // overview table, see viewOverview
  folderSort:{ key:'name', dir:1 },   // folder list view, see viewFolder
  searchScoped:false,   // "only <project>" toggle, see viewSearch
  docOff:new Set(),   // docFirst nodes the reader switched off this session, see viewDocFirst
  focus:null,   // id of the row holding the tree's keyboard cursor
  hit:-1 };     // index of the highlighted search result

// Tree expansion is no longer remembered across a reload -- it is computed fresh every
// load instead (see the init block at the bottom): collapsed, except the path down to
// whichever project a link points at. A remembered "Documents was open last time" is
// exactly what that default is meant to avoid.

const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
/**
 * Make a plain element behave like a control: click, a focus stop, and a role so
 * Enter/Space reach it. Every clickable thing on this page is a div, which until
 * 2026-08-31 meant the entire UI was unreachable without a mouse -- 21 handlers and not
 * one tabindex. Defined here rather than at 21 call sites so it stays defined once.
 */
const activate = (node, handler, role = 'button') => {
  node.onclick = handler;
  node.tabIndex = 0;
  node.setAttribute('role', role);
  return node;
};

/** Wrap the matched run of `q` in <mark>, without ever building HTML from input. */
function mark(text, q) {
  const host = el('span');
  const i = q ? text.toLowerCase().indexOf(q) : -1;
  if (i < 0) { host.textContent = text; return host; }
  host.append(text.slice(0, i), el('mark', '', text.slice(i, i + q.length)), text.slice(i + q.length));
  return host;
}
const tintOf = n => TINT[n.kind] || TINT.file;
const fmtSize = b => !b ? '' : b < 1024 ? b + 'b' : b < 1048576 ? (b/1024).toFixed(1) + 'k' : (b/1048576).toFixed(1) + 'm';
// Relative, because "3 days ago" is the question people actually ask of a file list.
const fmtAgo = (ms) => {
  if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  const [n, unit] = s < 60 ? [s, 'second'] : s < 3600 ? [s / 60, 'minute'] : s < 86400 ? [s / 3600, 'hour']
    : s < 2592000 ? [s / 86400, 'day'] : s < 31536000 ? [s / 2592000, 'month'] : [s / 31536000, 'year'];
  const v = Math.floor(n);
  return v + ' ' + unit + (v === 1 ? '' : 's') + ' ago';
};
// Ids are drive-relative, except user-scope ones which the server prefixes with `~/`.
const absOf = id => id === '~' ? (S.data?.home || '~')
  : id.startsWith('~/') ? (S.data?.home || '~') + id.slice(1)
  : 'D:/AI_Agents/' + id;
const winPath = id => absOf(id).replace(/\//g, '\\');

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1400);
}

// ── data ───────────────────────────────────────────────────────────────────
function reindex(data) {
  pictureNodes.attach(data.tree);
  S.data = data;
  S.byId.clear(); S.parent.clear();
  // The search index used to arrive from the server as a second copy of the tree --
  // 25,731 entries, 4.42MB of a 10.23MB payload, 2.47MB of it duplicated id strings.
  // Every field it carried is on the node it was copied from, and this walk was already
  // happening, so it is built here instead. Nodes go in by reference: no second copy.
  S.index = [];
  (function rec(list, parent) {
    for (const n of list) {
      S.byId.set(n.id, n);
      if (parent) S.parent.set(n.id, parent.id);
      // Plain source files are noise in results, the same rule the server applied.
      if (includeInSearch(n) && (!pictureNodes.owns(n.id) || n.id === pictureNodes.rootId)) S.index.push(n);
      if (n.children) rec(n.children, n);
    }
  })(data.tree, null);
}

/**
 * Walk any node id up to its top-level root (a project, Documents, Skills, Pictures,
 * Automations, or the user-CLI root) — the thing a repo/runtime/search hit belongs to,
 * for scoping a view to "whichever root is currently selected" without the server having
 * to tag every repo and runtime with which project it's under.
 */
// Kinds that mark a scoping boundary -- a project workspace, or one of the shared
// roots. Climbing stops AT one of these, not past it: project roots now nest one level
// under the Projects folder, so walking all the way to "no parent" would land on that
// folder instead of the project itself.
const SCOPE_ROOT_KINDS = new Set(['root', 'docroot', 'userroot']);
function topAncestorOf(id) {
  let p = id;
  while (S.parent.has(p)) {
    const node = S.byId.get(p);
    if (node && SCOPE_ROOT_KINDS.has(node.kind)) return node;
    p = S.parent.get(p);
  }
  return S.byId.get(p);
}

let loading = null;
let queued = null;
let restoredInitialRoute = false;
let restoreReading = null;

/**
 * One scan in flight at a time. A watcher burst while a scan is running collapses
 * into a single follow-up instead of stacking 5MB fetches until the tab freezes.
 */
function load(opts = {}) {
  if (loading) { queued = { quiet: true, ...queued, ...opts, fresh: !!(queued?.fresh || opts.fresh), force: !!(queued?.force || opts.force) }; return loading; }
  loading = doLoad(opts).finally(() => {
    loading = null;
    if (queued) { const next = queued; queued = null; load(next); }
  });
  return loading;
}

async function doLoad({ quiet, fresh, force } = {}) {
  if (!quiet) $('#live').textContent = '● scanning…';

  let data;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 90000);
  try {
    const r = await fetch('/api/scan' + (fresh ? '?fresh=1' : ''), { signal: controller.signal });
    if (!r.ok) throw new Error(`the hub server answered ${r.status} for /api/scan`);
    data = await r.json();
  } catch (err) {
    // Opening index.html through a static preview (VS Code Live Preview / Live Server,
    // or file://) serves the shell but not the API, so everything 404s. Say that out
    // loud instead of leaving a blank page and a spinner that never stops.
    if (S.data) {
      $('#live').textContent = '● disconnected';
      $('#live').classList.add('stale');
      $('#connection').hidden = false;
      $('#connection span').textContent = 'Refresh failed. Showing the last successful scan (' + new Date(S.data.scannedAt).toLocaleTimeString() + ').';
    } else showFatal(err);
    return;
  } finally { clearTimeout(timeout); }

  const t = new Date(data.scannedAt);
  const stamp = `● scanned ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;

  $('#connection').hidden = true;
  const same = data.sig === S.sig;
  S.sig = data.sig;
  // Timestamps are only as fresh as the scan they were fetched under.
  if (!same) { folderTimesGen++; folderTimes.clear(); }
  if (!same) reindex(data); else { pictureNodes.attach(data.tree); S.data = data; }
  $('#live').textContent = stamp;
  $('#live').classList.remove('stale');

  // A watcher tick usually means a file changed somewhere irrelevant. Repainting
  // then would blow away scroll position and selection for no reason.
  if (same && !force) return;

  if (S.sel && !S.byId.has(S.sel)) S.sel = null;
  const scroll = $('#view').scrollTop;
  restoreReading = { id: S.sel, scroll };
  renderTree(); renderPins(); renderView();
  $('#view').scrollTop = scroll;
  if (!restoredInitialRoute) {
    restoredInitialRoute = true;
    // A pasted or reloaded search URL has to restore the query too, not just documents.
    const search = parseSearch(location.hash);
    if (search) {
      S.query = search.query; S.searchScoped = search.scoped; S.hitLimit = search.limit; S.hit = -1;
      $('#q').value = search.query;
      renderView();
    } else {
      const linked = parseRoute(location.hash);
      if (linked.id && (S.byId.has(linked.id) || pictureNodes.owns(linked.id))) go(linked.id, linked.heading);
    }
  }
}

const HUB_PORT = '%PORT%';

/** The page can't work without the server. Explain which case this is and how to fix it. */
function showFatal(err) {
  $('#live').textContent = '● no server';
  $('#live').classList.add('stale');
  $('#tree').textContent = '';
  $('#crumbs').textContent = '';

  const servedStatically = location.protocol === 'file:' || location.port !== HUB_PORT;
  const url = `http://127.0.0.1:${HUB_PORT}`;

  const v = $('#view'); v.textContent = '';
  const page = el('div', 'page');
  page.append(el('h1', 't', servedStatically ? 'Opened without the hub server' : 'Cannot reach the hub server'));

  const p = el('p', 'lede');
  p.textContent = servedStatically
    ? `This page is being served from ${location.origin || 'the local filesystem'}, which returns the HTML but none of the /api endpoints. `
      + `The tree, the repo table, and every document come from the hub server, so the page stays empty.`
    : `The page loaded but /api/scan did not answer. The hub server has probably stopped.`;
  page.append(p);

  const box = el('div', 'box');
  box.append(el('div', 'cap', servedStatically ? 'Open it this way instead' : 'Restart it'));
  const pre = el('pre');
  pre.style.cssText = 'margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.9;color:var(--fg-mid);white-space:pre-wrap';
  pre.textContent = servedStatically
    ? `In VS Code:  Ctrl+Shift+P  ->  "Simple Browser: Show"  ->  ${url}\n`
      + `A static preview (Live Preview / Live Server / file://) cannot work here.\n\n`
      + `If nothing is listening yet, start it first:\n`
      + `  cd Project-Hub\n  .\\Start-Hub.ps1`
    : `  cd Project-Hub\n  .\\Start-Hub.ps1 -Restart`;
  box.append(pre);
  page.append(box);

  const link = el('p', 'lede');
  const a = el('a', '', url);
  a.href = url;
  link.append(document.createTextNode('Server URL: '), a);
  page.append(link);

  const detail = el('div', 'path');
  detail.textContent = String(err && err.message ? err.message : err);
  page.append(detail);

  const retry = el('button', 'btn', 'Retry connection'); retry.onclick = () => load({ force: true }); page.append(retry);
  v.append(page);
}

// ── bookmarks and recents (P7-10) ──────────────────────────────────────────
// Two lists above the tree. Both start collapsed, so a fresh tab looks exactly like it
// did before this existed -- which is the whole point of the collapsed-tree startup.
// Storage is localStorage, paths only. The list logic lives in navigation.mjs so it can
// be tested without a DOM; everything here is the sidebar and the wiring.
const pins = { bookmarks: [], recent: [], open: { bookmarks: false, recent: false } };
try {
  pins.bookmarks = parseList(localStorage.getItem(BOOKMARKS_KEY));
  pins.recent = parseList(localStorage.getItem(RECENT_KEY));
} catch {}

// Both lists are at most a few dozen short rows, so writing both on any change beats
// threading a key through every call site. Paths and labels only -- never contents.
function savePins() {
  try {
    localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(pins.bookmarks));
    localStorage.setItem(RECENT_KEY, JSON.stringify(pins.recent));
  } catch {}
}

/** Recents are documents, not containers: a folder you passed through is not a read. */
function recordRecent(id) {
  const n = S.byId.get(id);
  if (!n || DIRISH.has(n.kind)) return;
  pins.recent = pushRecent(pins.recent, id, n.name);
  savePins();
}

function togglePin(id, label) {
  if (!id) return;
  const was = isBookmarked(pins.bookmarks, id);
  pins.bookmarks = toggleBookmark(pins.bookmarks, id, label || S.byId.get(id)?.name);
  savePins();
  if (!was) pins.open.bookmarks = true;   // show what just happened
  renderPins();
  renderView();
  toast(was ? 'bookmark removed' : 'bookmarked');
}

/**
 * A missing path gets one relink candidate, never an automatic repoint. The basename
 * map is built only when something is actually unresolved -- normally nothing is, and
 * walking 25k nodes on every sidebar render to discover that would be absurd.
 */
const pinKey = (id) => JSON.stringify([id.split('/')[0], id.split('/').pop()]);

/**
 * What a pin belongs to, in the hub's own terms: the repo if it sits inside one, otherwise
 * the project or shared root it lives under. Three folders all called "Agents" are three
 * different projects, and the name alone never says which -- so the row carries its owner
 * in small dim text rather than growing a second line.
 *
 * Climbing stops at the first repo OR scope root, which is what makes the two cases fall
 * out of one walk: a file deep in a repo hits the repo first, anything else hits its
 * project. A path the scan does not have (unresolved, or Pictures not yet loaded) has only
 * its own parent folder to offer.
 */
function pinContext(path) {
  if (!S.byId.has(path)) {
    const parts = path.split('/');
    return parts.length > 1 ? parts[parts.length - 2] : '';
  }
  for (let p = S.parent.get(path); p; p = S.parent.get(p)) {
    const ancestor = S.byId.get(p);
    if (!ancestor) break;
    if (ancestor.kind === 'repo' || SCOPE_ROOT_KINDS.has(ancestor.kind)) return ancestor.name;
  }
  return '';
}
function relinkSuggester() {
  let byName = null;
  return (path) => {
    if (!byName) {
      byName = new Map();
      for (const id of S.byId.keys()) {
        const key = pinKey(id);
        const hit = byName.get(key);
        byName.set(key, hit === undefined ? id : null);   // null = ambiguous
      }
    }
    return byName.get(pinKey(path)) || '';
  };
}

/**
 * Pictures nodes are fetched on demand, so a bookmarked photo is legitimately absent
 * from S.byId until its folder is opened. Calling that a dead link would be wrong.
 */
function pinExists(path) {
  return S.byId.has(path) || pictureNodes.owns(path);
}

function pinSection(key, title, entries, drag) {
  const sec = el('div', 'pinsec');
  const head = el('div', 'pinhead');
  head.append(el('span', 'chev', pins.open[key] ? '▾' : '▸'), el('span', 'n', title), el('span', 'c', String(entries.length)));
  head.setAttribute('aria-expanded', String(pins.open[key]));
  activate(head, () => { pins.open[key] = !pins.open[key]; renderPins(); });
  sec.append(head);
  if (!pins.open[key]) return sec;

  const list = el('div', 'pinlist');
  list.setAttribute('role', 'list');
  // The context usually does the disambiguating on its own -- three "Agents" rows in three
  // projects need no help once each says which project. Only fall back to prefixing the
  // parent folder when label AND context still collide, which is two READMEs in one repo.
  const ctx = new Map(entries.map((e) => [e.path, pinContext(e.path)]));
  const clash = new Map();
  for (const e of entries) {
    const k = JSON.stringify([e.label, ctx.get(e.path)]);
    clash.set(k, (clash.get(k) || 0) + 1);
  }
  const display = (e) => (clash.get(JSON.stringify([e.label, ctx.get(e.path)])) > 1
    ? (e.path.split('/').slice(-2, -1)[0] || '') + '/' + e.label : e.label);
  if (!entries.length) {
    list.append(el('div', 'pinempty', key === 'bookmarks' ? 'nothing pinned yet — Ctrl+D pins the open document' : 'no documents opened yet'));
  }
  entries.forEach((entry, i) => {
    const row = el('div', 'pin' + (S.sel === entry.path ? ' sel' : '') + (entry.unresolved ? ' gone' : ''));
    row.setAttribute('role', 'listitem');
    row.dataset.path = entry.path;
    row.dataset.missing = String(!!entry.unresolved);
    row.dataset.renameable = String(!!drag);   // only bookmarks carry a custom label
    const name = el('span', 'nm', display(entry));
    name.title = entry.path + (entry.unresolved ? ' — not found in the last scan' : '');
    const x = el('span', 'x', '×');
    x.title = 'Remove';
    x.setAttribute('aria-label', 'Remove ' + entry.label);
    activate(x, (ev) => {
      ev?.stopPropagation?.();
      if (key === 'bookmarks') pins.bookmarks = pins.bookmarks.filter((e) => e.path !== entry.path);
      else pins.recent = pins.recent.filter((e) => e.path !== entry.path);
      savePins();
      renderPins();
    });
    const owner = ctx.get(entry.path);
    // Suppress a context that only repeats the label -- a bookmarked repo named after
    // its own folder, or a pin renamed to match its project.
    if (owner && owner !== entry.label) row.append(name, el('span', 'ctx', owner), x);
    else row.append(name, x);
    activate(row, () => { if (!entry.unresolved) go(entry.path); }, 'button');

    if (drag) {
      // Native drag-and-drop: manual ordering with no library and no pointer maths.
      row.draggable = true;
      row.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', String(i)); row.classList.add('dragging'); });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drop'); });
      row.addEventListener('dragleave', () => row.classList.remove('drop'));
      row.addEventListener('drop', (e) => {
        e.preventDefault(); row.classList.remove('drop');
        pins.bookmarks = moveBookmark(pins.bookmarks, parseInt(e.dataTransfer.getData('text/plain'), 10), i);
        savePins(); renderPins();
      });
      // Double-click renames in place. No dialog: prompt() blocks the whole page.
      name.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const input = el('input', 'nm'); input.value = entry.label;
        const commit = (save) => {
          if (input.parentNode !== row) return;
          if (save) { pins.bookmarks = renameBookmark(pins.bookmarks, entry.path, input.value.trim()); savePins(); }
          renderPins();
        };
        input.onkeydown = (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
          else if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
          ev.stopPropagation();
        };
        input.onblur = () => commit(true);
        input.onclick = (ev) => ev.stopPropagation();
        row.replaceChild(input, name);
        input.focus(); input.select();
      });
    }

    list.append(row);
    if (entry.unresolved && entry.suggestion) {
      const note = el('div', 'pinnote');
      const relink = el('button', '', 'relink to ' + entry.suggestion);
      relink.onclick = () => {
        pins.bookmarks = pins.bookmarks.map((e) => (e.path === entry.path ? { ...e, path: entry.suggestion } : e));
        savePins(); renderPins();
      };
      note.append('moved? ', relink);
      list.append(note);
    }
  });
  sec.append(list);
  return sec;
}

function renderPins() {
  const host = $('#pins');
  host.textContent = '';
  // Before the first scan lands nothing can be checked, so nothing is called missing.
  const marked = S.data
    ? resolveBookmarks(pins.bookmarks, pinExists, relinkSuggester())
    : pins.bookmarks.map((e) => ({ ...e, unresolved: false, suggestion: '' }));
  host.append(pinSection('bookmarks', 'Bookmarks', marked, true));
  host.append(pinSection('recent', 'Recent', pins.recent, false));
}

function bookmarkBtn(id) {
  const on = isBookmarked(pins.bookmarks, id);
  const b = el('button', 'btn star' + (on ? ' on' : ''), (on ? '★' : '☆') + ' bookmark');
  b.title = (on ? 'Remove bookmark' : 'Add bookmark') + ' (Ctrl+D)';
  b.setAttribute('aria-pressed', String(on));
  b.onclick = () => togglePin(id);
  return b;
}

// ── sidebar tree ───────────────────────────────────────────────────────────
function renderTree() {
  const host = $('#tree');
  const hadFocus = host.contains(document.activeElement);
  host.textContent = '';
  host.setAttribute('role', 'tree');
  host.setAttribute('aria-label', 'Project explorer');
  // Roving tabindex: exactly one row is a tab stop, and the arrow keys move it. A tree
  // where every row is tabbable is worse than one that is not tabbable at all.
  const rows = [];
  const frag = document.createDocumentFragment();
  (function rec(list, depth) {
    for (const n of list) {
      const hasKids = !!(n.lazy && !n.loaded || n.children?.length);
      const open = S.open.has(n.id);
      const row = el('div', 'node' + (S.sel === n.id ? ' sel' : ''));
      row.style.paddingLeft = (8 + depth * 12) + 'px';
      row.dataset.id = n.id;
      row.setAttribute('role', 'treeitem');
      row.setAttribute('aria-level', String(depth + 1));
      row.setAttribute('aria-selected', String(S.sel === n.id));
      if (hasKids) row.setAttribute('aria-expanded', String(open));
      row.tabIndex = -1;
      rows.push(row);

      const chev = el('span', 'chev', hasKids ? (open ? '▾' : '▸') : '');
      if (hasKids) chev.dataset.toggle = n.id;
      const dot = el('span', 'dot' + (ROUND.has(n.kind) ? ' round' : ''));
      dot.style.background = tintOf(n);
      row.append(chev, dot, el('span', 'nm', n.name), el('span', 'bdg', n.badge || ''));
      frag.append(row);

      if (hasKids && open && n.children) rec(n.children, depth + 1);
    }
  })(S.data.tree, 0);
  host.append(frag);

  // The tab stop follows the keyboard cursor, then the selection, then the first row.
  const wanted = rows.find((r) => r.dataset.id === S.focus)
    || rows.find((r) => r.dataset.id === S.sel) || rows[0];
  if (wanted) {
    wanted.tabIndex = 0;
    // Re-rendering blows away focus, and an expand/collapse re-renders. Put it back.
    if (hadFocus) wanted.focus();
  }
}

/** Move the keyboard cursor to a row and give it focus. */
function focusNode(id) {
  const row = [...$('#tree').querySelectorAll('.node')].find((r) => r.dataset.id === id);
  if (!row) return;
  S.focus = id;
  for (const r of $('#tree').querySelectorAll('.node')) r.tabIndex = -1;
  row.tabIndex = 0;
  row.focus();
  row.scrollIntoView({ block: 'nearest' });
}

// Arrow keys walk the tree the way a file explorer does: up/down move, right opens or
// steps in, left closes or steps out to the parent.
$('#tree').addEventListener('keydown', (e) => {
  const rows = [...$('#tree').querySelectorAll('.node')];
  const i = rows.indexOf(document.activeElement);
  if (i < 0) return;
  const id = rows[i].dataset.id;
  const n = S.byId.get(id);
  const hasKids = !!(n && (n.lazy && !n.loaded || n.children?.length));
  const step = (j) => { const t = rows[Math.max(0, Math.min(rows.length - 1, j))]; if (t) focusNode(t.dataset.id); };

  switch (e.key) {
    case 'ArrowDown': step(i + 1); break;
    case 'ArrowUp': step(i - 1); break;
    case 'Home': step(0); break;
    case 'End': step(rows.length - 1); break;
    case 'ArrowRight':
      if (hasKids && !S.open.has(id)) { S.focus = id; toggleFolder(id); }
      else if (hasKids) step(i + 1);
      break;
    case 'ArrowLeft':
      if (hasKids && S.open.has(id)) { S.open.delete(id); S.focus = id; renderTree(); focusNode(id); }
      else { const p = S.parent.get(id); if (p) { renderTree(); focusNode(p); } }
      break;
    case 'Enter': case ' ':
      go(id);
      // go() re-renders; keep the cursor where the user left it.
      focusNode(id);
      break;
    default: return;
  }
  e.preventDefault();
});

$('#tree').addEventListener('click', (e) => {
  const chev = e.target.closest('[data-toggle]');
  const row = e.target.closest('.node');
  if (!row) return;
  const id = row.dataset.id;
  if (chev) { toggleFolder(id); return; }
  go(id);
});

activate($('#collapse'), () => { S.open.clear(); renderTree(); });

// ── sidebar context menu ─────────────────────────────────────────────────
// Right-click on any row for the destinations the header buttons already offer
// (copy path, open, open in VS Code) without selecting the row first, plus two
// that only exist here: "Copy as Markdown Link" for pasting a row straight into a
// README, and "Open Folder", which reveals the row -- file or folder -- selected
// inside its parent Explorer window (server side: `/api/open?...&reveal=1`, which
// shells out to `explorer /select,` instead of `start`). That is a different
// destination from "Open"/"Open File": Open acts on the row itself (browse into a
// folder, launch a file), Open Folder always shows you where it lives.
let ctxMenuEl = null;
function closeCtxMenu() {
  if (!ctxMenuEl) return;
  ctxMenuEl.remove();
  ctxMenuEl = null;
  document.removeEventListener('pointerdown', onCtxOutside, true);
  document.removeEventListener('keydown', onCtxEscape, true);
  window.removeEventListener('resize', closeCtxMenu);
  window.removeEventListener('blur', closeCtxMenu);
  $('#view').removeEventListener('scroll', closeCtxMenu);
  $('#tree').removeEventListener('scroll', closeCtxMenu);
}
function onCtxOutside(e) { if (ctxMenuEl && !ctxMenuEl.contains(e.target)) closeCtxMenu(); }
function onCtxEscape(e) { if (e.key === 'Escape') closeCtxMenu(); }

function ctxItem(label, handler, disabled = false) {
  const b = el('button', '', label);
  if (disabled) b.disabled = true;
  else b.onclick = () => { closeCtxMenu(); handler(); };
  return b;
}

function showCtxMenu(x, y, n, opts = {}) {
  closeCtxMenu();
  const isDir = DIRISH.has(n.kind);
  // Two different absences. The synthetic Projects node has no path at all, so even the
  // path copies are meaningless. A bookmark whose file went missing still has its last
  // known path -- which is the one thing you want when hunting for where it went -- so
  // only the launch actions go dead there.
  const virtual = n.kind === 'projects';
  const unlaunchable = virtual || !!opts.missing;
  const copy = (value) => navigator.clipboard.writeText(value).then(() => toast('copied')).catch(() => toast('copy failed'));
  const menu = el('div', 'ctxmenu');
  menu.append(
    ctxItem(isBookmarked(pins.bookmarks, n.id) ? 'Remove Bookmark' : 'Add Bookmark', () => togglePin(n.id, n.name)),
    ...(opts.rename ? [ctxItem('Rename Bookmark', opts.rename)] : []),
    el('hr'),
    ctxItem('Copy Hub Link', () => copy(hubLink(n.id))),
    ctxItem('Copy Path', () => copy(winPath(n.id)), virtual),
    ctxItem('Copy Relative Path', () => copy(n.id), virtual),
    ctxItem('Copy as Markdown Link', () => copy(markdownLink(n.name, hubLink(n.id)))),
    el('hr'),
    ctxItem(isDir ? 'Open' : 'Open File', () => requestOpen(n.id), unlaunchable),
    ctxItem('Reveal in Explorer', () => requestOpen(n.id, '&reveal=1'), unlaunchable),
    ctxItem('Open in VS Code', () => requestOpen(n.id, '&in=code'), unlaunchable),
  );

  document.body.append(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 6)) + 'px';
  menu.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
  ctxMenuEl = menu;

  // Deferred one tick so the click that opened the menu doesn't also close it via
  // the outside-pointerdown listener (both fire on the same physical right-click).
  setTimeout(() => {
    document.addEventListener('pointerdown', onCtxOutside, true);
    document.addEventListener('keydown', onCtxEscape, true);
    window.addEventListener('resize', closeCtxMenu);
    window.addEventListener('blur', closeCtxMenu);
    $('#view').addEventListener('scroll', closeCtxMenu);
    $('#tree').addEventListener('scroll', closeCtxMenu);
  }, 0);
}

// ── scan status detail (P7-16) ─────────────────────────────────────────────
// `● scanned 09:25` was the whole story, and a green `ready` sat on top of nineteen read
// errors without a word. Clicking the status opens the numbers behind it, the paths that
// actually failed, and what the index does and does not cover.
//
// It reuses the context menu's floating layer wholesale -- same element bookkeeping, same
// dismissal on Escape, outside click, scroll and resize. There should only ever be one
// floating layer, and this is one.
const fmtMs = (ms) => (ms == null ? '—' : ms < 1000 ? Math.round(ms) + 'ms' : (ms / 1000).toFixed(1) + 's');

/**
 * "N other files here that the index skips" -- with the phrase that explains it wired to
 * the panel that does. Saying "see what's indexed" and linking nowhere is the same kind of
 * dead end as the count with no paths behind it.
 */
function skippedNote(count, suffix = '') {
  const note = el('div', 'empty');
  note.append(`${count} other file${count === 1 ? '' : 's'} here that the index skips — `);
  const link = el('span', 'ex-act', "see what's indexed");
  link.style.display = 'inline';
  activate(link, () => showStatusPanel($('#live')));
  note.append(link);
  if (suffix) note.append(suffix);
  return note;
}

function statusRow(into, label, value, warn) {
  const row = el('div', 'kv' + (warn ? ' warn' : ''));
  row.append(el('span', '', label), el('b', '', String(value)));
  into.append(row);
}

async function showStatusPanel(anchor) {
  closeCtxMenu();
  const panel = el('div', 'ctxmenu status');
  panel.append(el('h3', '', 'Scan'), el('div', '', 'loading…'));
  document.body.append(panel);
  ctxMenuEl = panel;
  const place = () => {
    const r = panel.getBoundingClientRect(), a = anchor.getBoundingClientRect();
    panel.style.left = Math.max(4, Math.min(a.left, window.innerWidth - r.width - 6)) + 'px';
    panel.style.top = Math.max(4, a.top - r.height - 6) + 'px';
  };
  place();
  setTimeout(() => {
    document.addEventListener('pointerdown', onCtxOutside, true);
    document.addEventListener('keydown', onCtxEscape, true);
    window.addEventListener('resize', closeCtxMenu);
    window.addEventListener('blur', closeCtxMenu);
    $('#view').addEventListener('scroll', closeCtxMenu);
    $('#tree').addEventListener('scroll', closeCtxMenu);
  }, 0);

  let h;
  try { h = await (await fetch('/api/health')).json(); }
  catch (err) {
    if (ctxMenuEl !== panel) return;
    panel.textContent = ''; panel.append(el('h3', '', 'Scan'), el('p', '', 'Status unavailable — ' + err.message));
    return place();
  }
  if (ctxMenuEl !== panel) return;   // dismissed while the request was in flight
  panel.textContent = '';

  const scan = h.lastScan || {};
  panel.append(el('h3', '', 'Last successful scan'));
  statusRow(panel, 'finished', scan.at ? new Date(scan.at).toLocaleTimeString() : '—');
  statusRow(panel, 'age', scan.ageSec == null ? '—' : fmtAgo(Date.now() - scan.ageSec * 1000) || 'just now');
  statusRow(panel, 'duration', fmtMs(scan.ms));
  statusRow(panel, 'indexed', (scan.nodes ?? 0).toLocaleString() + ' nodes');
  statusRow(panel, 'payload', scan.gzipMb == null ? '—' : scan.gzipMb + ' MB gzipped');

  const t = scan.timings || {};
  panel.append(el('h3', '', 'Where the time went'));
  for (const [label, ms] of [['walking folders', t.walkMs], ['reading git', t.gitMs],
    ['assembling', t.assembleMs], ['serializing', t.serializeMs], ['compressing', t.gzipMs]]) {
    statusRow(panel, label, fmtMs(ms));
  }

  panel.append(el('h3', '', 'Roots'));
  statusRow(panel, 'projects', h.workspace || '—');
  const pics = h.pictures || {};
  statusRow(panel, 'pictures', pics.state === 'unloaded' ? 'loaded on demand'
    : `${(pics.indexedEntries || 0).toLocaleString()} indexed, ${pics.cachedFolders || 0} folders cached`);
  if (pics.readErrors) statusRow(panel, 'pictures unreadable', pics.readErrors + ' folders', true);
  if (pics.depthLimited) statusRow(panel, 'below depth ' + pics.maxSearchDepth, pics.depthLimited + ' folders — browsable, not searched', true);

  // The actionable half. A count behind a green `ready` is the thing this panel exists to fix.
  panel.append(el('h3', '', 'Read errors'));
  statusRow(panel, 'last three scans', h.readErrorsRecent ?? 0, !!h.readErrorsRecent);
  statusRow(panel, 'since start', h.readErrors ?? 0, false);
  const paths = h.readErrorPaths || [];
  if (!paths.length) panel.append(el('p', '', 'No file has failed to read.'));
  else {
    panel.append(el('p', '', 'Most recent first. Click one to open it in the tree if it is indexed.'));
    for (const e of [...paths].reverse()) {
      const row = el('div', 'err', e.code + '  ' + e.path);
      row.title = e.path + ' — ' + e.code;
      if (S.byId.has(e.path)) activate(row, () => { closeCtxMenu(); go(e.path); });
      panel.append(row);
    }
  }

  panel.append(el('h3', '', 'What gets indexed'));
  panel.append(el('p', '', 'Documents and config (md, txt, rst, adoc, json, yaml, toml, ini, csv), '
    + 'reports (pdf, html), images (png, jpg, gif, svg, webp, avif, ico), and LICENSE / Dockerfile / '
    + 'Makefile / CNAME. Source files, build output and dependencies are skipped, so a folder can '
    + 'hold more than the tree shows — "open folder" always shows everything.'));
  panel.append(el('p', '', 'Credential directories and credential-looking filenames are pruned by '
    + 'name and are never readable through the hub. Pictures is browsed on demand and searched to '
    + (pics.maxSearchDepth || 7) + ' levels; deeper folders stay browsable.'));

  place();
}
