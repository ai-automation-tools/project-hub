async function ensurePicture(id) {
  const generation = pictureGeneration;
  const known = S.byId.get(id);
  if (known && (!known.lazy || known.loaded)) return;
  if (pictureRequests.has(id)) return pictureRequests.get(id);
  const pending = (async () => {
    let response;
    for (let attempt = 0; attempt < 2; attempt++) {
      response = await fetch('/api/pictures?path=' + encodeURIComponent(id));
      if (response.status !== 409) break;
    }
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Pictures could not be loaded');
    if (generation !== pictureGeneration) return;
    pictureNodes.merge(data);
    reindex(S.data);
  })();
  pictureRequests.set(id, pending);
  try { await pending; } finally { if (pictureRequests.get(id) === pending) pictureRequests.delete(id); }
}

async function toggleFolder(id) {
  if (S.open.has(id)) { S.open.delete(id); renderTree(); return; }
  S.open.add(id); renderTree();
  if (pictureNodes.owns(id)) {
    try { await ensurePicture(id); }
    catch (err) { S.open.delete(id); toast(err.message + ' — click to retry'); }
    renderTree();
  }
}

/** Select a node, reveal it in the tree, and render its page. */
async function go(id, heading = '') {
  requestedNavigation = { id, heading };
  const request = ++navigationRequest;
  if (pictureNodes.owns(id)) {
    try { await ensurePicture(id); }
    catch (err) { if (request === navigationRequest) toast(err.message + ' — click to retry'); return; }
    if (request !== navigationRequest) return;
  }
  if (!S.byId.has(id)) return;
  S.sel = id;
  S.heading = heading;
  restoreReading = null;
  S.focus = id;
  S.query = ''; $('#q').value = ''; S.hit = -1;
  // The address bar is the only place this state was not kept, which meant no
  // bookmarking, no sharing a link to a skill, and a Back button that did nothing.
  const hash = routeHash(id, heading);
  if (location.hash !== hash) location.hash = hash;
  for (let p = S.parent.get(id); p; p = S.parent.get(p)) S.open.add(p);
  const n = S.byId.get(id);
  if (n.children && n.children.length) S.open.add(id);
  recordRecent(id);
  renderTree(); renderPins(); renderView();
  $('#view').scrollTop = 0;
  const sel = $('.node.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

/**
 * Keep the address bar in step with the search box.
 *
 * Entering a search pushes a new history entry so Back can return to the document you
 * came from; refining the query replaces it, so typing does not bury the history in one
 * entry per keystroke. Opening a result pushes on top via go(), which is what makes Back
 * land on the results again instead of the previous document. pushState/replaceState do
 * not fire hashchange, so this never re-enters the handler below.
 */
function syncSearchRoute(replace) {
  const hash = S.query
    ? searchHash(S.query, S.searchScoped, S.hitLimit)
    : routeHash(S.sel || defaultRootId(), S.heading);
  if (location.hash === hash) return;
  try { history[replace ? 'replaceState' : 'pushState'](null, '', hash); }
  catch { location.hash = hash; }
}

// ── header ─────────────────────────────────────────────────────────────────
// "Nothing selected yet" used to just mean "show the first (only) root" — now it lands
// on the Projects folder instead, whose own view is the portfolio-wide summary.
function defaultRootId() { return S.byId.has('@projects') ? '@projects' : S.data.tree[0].id; }

function renderCrumbs() {
  const c = $('#crumbs'); c.textContent = '';
  if (S.query) { c.append(el('span', '', 'search')); return; }
  const chain = [];
  for (let id = S.sel; id; id = S.parent.get(id)) chain.unshift(id);
  if (!chain.length) chain.push(defaultRootId());
  chain.forEach((id, i) => {
    if (i) c.append(el('span', '', '/'));
    const s = el('span', '', S.byId.get(id)?.name || id);
    s.dataset.go = id;
    s.style.color = i === chain.length - 1 ? 'var(--fg-hi)' : 'var(--dim)';
    activate(s, () => go(id));
    c.append(s);
  });
}

$('#rescan').onclick = () => load({ fresh: true, force: true });
$('#retry').onclick = () => load({ force: true });
let queryTimer;
$('#q').addEventListener('input', (e) => {
  const wasSearching = !!S.query;
  S.query = e.target.value.trim(); S.hit = -1; S.hitLimit = 200;
  syncSearchRoute(wasSearching);
  clearTimeout(queryTimer); queryTimer = setTimeout(renderView, 150);
});

// Results were mouse-only: you typed, then reached for the mouse. Up/down walk them,
// Enter opens the highlighted one (or the top one, if you have not moved yet).
$('#q').addEventListener('keydown', (e) => {
  if (!S.query) return;
  const hits = [...$('#view').querySelectorAll('.hit')];
  if (!hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    S.hit = Math.max(0, Math.min(hits.length - 1, S.hit + (e.key === 'ArrowDown' ? 1 : -1)));
    syncCombobox(S.hit);
    hits[S.hit].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    hits[Math.max(0, S.hit)].click();
  }
});

// ── sidebar rail + color scheme ────────────────────────────────────────────
// Both are pure presentation, so they live in localStorage rather than the scan.
const setRail = (on) => {
  $('#app').classList.toggle('rail', on);
  try { localStorage.setItem('hub.rail', on ? '1' : '0'); } catch {}
};
const toggleRail = () => setRail(!$('#app').classList.contains('rail'));
activate($('#sidetoggle'), toggleRail);

// Sidebar is flush against the viewport edge, so a drag's clientX doubles as the
// width to apply — no offset math needed.
const SBW_MIN = 200, SBW_MAX = 480;
const setSbw = (w) => {
  const clamped = Math.max(SBW_MIN, Math.min(SBW_MAX, w));
  document.documentElement.style.setProperty('--sbw', clamped + 'px');
  try { localStorage.setItem('hub.sbw', clamped); } catch {}
};
$('#sidedrag').addEventListener('mousedown', (e) => {
  e.preventDefault();
  $('#app').classList.add('dragging');
  const move = (ev) => setSbw(ev.clientX);
  const up = () => {
    $('#app').classList.remove('dragging');
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});
try {
  const savedSbw = parseInt(localStorage.getItem('hub.sbw'), 10);
  if (savedSbw) setSbw(savedSbw);
} catch {}

// Back/forward over the hash trail go() already writes. history.back()/forward() need
// no button to work at all, but nothing on the page said so — this just gives the
// existing mechanism a visible, clickable home instead of relying on the browser's own
// chrome, which some embeds (VS Code's Simple Browser tab) put outside the page.
$('#navback').onclick = () => history.back();
$('#navfwd').onclick = () => history.forward();
document.addEventListener('keydown', (e) => {
  if (!e.altKey || e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  e.key === 'ArrowLeft' ? history.back() : history.forward();
});

// Left/right step through a folder of images, the way every picture viewer works. Only
// while an image is open, and never while the tree or the search box has the keyboard --
// both already own the arrow keys.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;   // Alt+arrows are Back/Forward
  if (S.byId.get(S.sel)?.kind !== 'image') return;
  const active = document.activeElement;
  if (active && (active.closest('#tree') || /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName))) return;
  const { list, index } = imageSiblings(S.sel);
  const next = index + (e.key === 'ArrowRight' ? 1 : -1);
  if (index < 0 || next < 0 || next >= list.length) return;
  e.preventDefault();
  go(list[next].id);
});

// Ctrl+D pins whatever is under the tree's keyboard cursor, falling back to the open
// document. Overrides the browser bookmark dialog, which would bookmark the hub itself.
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'd' || e.altKey) return;
  const target = document.activeElement?.closest?.('.node')?.dataset.id || S.sel;
  if (!target) return;
  e.preventDefault();
  togglePin(target);
});

const THEMES = ['midnight', 'oxide', 'cobalt', 'paper', 'plum', 'nord', 'sepia', 'mono'];
const setTheme = (name) => {
  const t = THEMES.includes(name) ? name : THEMES[0];
  document.documentElement.dataset.theme = t;
  $('#theme').value = t;
  try { localStorage.setItem('hub.theme', t); } catch {}
};
$('#theme').onchange = (e) => setTheme(e.target.value);

let stored = {};
try { stored = { rail: localStorage.getItem('hub.rail'), theme: localStorage.getItem('hub.theme') }; } catch {}
setRail(stored.rail === '1');
setTheme(stored.theme || THEMES[0]);

// Back/forward, a pasted link, or a hand-edited hash all land here. go() sets the hash
// itself, so the guard against re-entering on our own write is just comparing to S.sel.
window.addEventListener('hashchange', () => {
  if (!S.data) return;
  const search = parseSearch(location.hash);
  if (search) {
    S.query = search.query; S.searchScoped = search.scoped; S.hitLimit = search.limit; S.hit = -1;
    $('#q').value = search.query;
    renderView();
    return;
  }
  // Leaving a search route: drop the query first, or renderView() would draw results again.
  const leavingSearch = !!S.query;
  if (leavingSearch) { S.query = ''; $('#q').value = ''; S.hit = -1; }
  const route = parseRoute(location.hash);
  const id = route.id || defaultRootId();
  if ((id !== S.sel || route.heading !== S.heading) && (S.byId.has(id) || pictureNodes.owns(id))) go(id, route.heading);
  else if (leavingSearch) renderView();
});

// Enter and Space on anything activate() marked. One delegated listener rather than a
// key handler per control. Native controls and the tree bring their own.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (!(t instanceof HTMLElement) || t.tabIndex < 0 || !t.hasAttribute('role')) return;
  if (t.getAttribute('role') === 'treeitem') return;
  if (/^(A|BUTTON|INPUT|SELECT|TEXTAREA|SUMMARY)$/.test(t.tagName)) return;
  e.preventDefault();
  t.click();
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleRail(); }
  if (e.key === 'Escape' && S.query) { S.query = ''; $('#q').value = ''; syncSearchRoute(true); renderView(); }
});

// ── views ──────────────────────────────────────────────────────────────────
/**
 * P7-15: arrowing through results only moved a visual class, so a screen reader was
 * never told which option was highlighted. The rows are already role=option inside a
 * listbox; this adds the state that makes the pair an actual combobox.
 *
 * Ids are assigned here rather than at build time because the Pictures section appends
 * its rows asynchronously, after the main list is already on the page, and the arrow
 * keys walk both lists as one sequence.
 */
function syncCombobox(active = S.hit) {
  const q = $('#q'), view = $('#view');
  const hits = S.query ? [...view.querySelectorAll('.hit')] : [];
  hits.forEach((h, i) => {
    h.id = 'hit-' + i;
    const on = i === active;
    h.classList.toggle('cur', on);
    h.setAttribute('aria-selected', String(on));
  });
  q.setAttribute('aria-expanded', String(hits.length > 0));
  if (active >= 0 && hits[active]) q.setAttribute('aria-activedescendant', hits[active].id);
  else q.removeAttribute('aria-activedescendant');
  return hits;
}

function renderView() {
  renderPage();
  syncCombobox();
}

function renderPage() {
  renderCrumbs();
  const v = $('#view'); v.textContent = '';
  const page = el('div', 'page');
  v.append(page);

  if (S.query) return viewSearch(page);
  const n = S.byId.get(S.sel) || S.byId.get(defaultRootId());
  if (n.kind === 'projects') return viewPortfolio(page, n);
  // Anything that documents itself opens on that README: the shared roots, and every
  // ordinary folder with one. Project roots and CLI runtimes never carry the flag -- their
  // own pages are the reason to click them -- and a node with no README falls straight
  // through to whatever view its kind already had.
  if (n.docFirst && n.doc && !S.docOff.has(n.id)) return viewDocFirst(page, n);
  if (n.kind === 'root') return viewOverview(page, n);
  if (n.kind === 'cli') return viewCli(page, n);
  if (n.kind === 'repo') return viewRepo(page, n);
  if (ENTITY.has(n.kind)) return viewEntity(page, n);
  if (n.kind === 'image') return viewImage(page, n);
  if (['md', 'config', 'file', 'html', 'pdf'].includes(n.kind)) return viewFile(page, n);
  return viewFolder(page, n);
}

function headerBlock(page, { title, tags = [], path, lede, actions = [] }) {
  if (path && S.sel) actions.unshift(bookmarkBtn(S.sel), copyBtn(hubLink(S.sel, S.heading), 'copy Hub link'));
  const wrap = el('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:9px';
  const row = el('div', 'row');
  const h = el('h1', 't', title); row.append(h);
  for (const t of tags) row.append(t);
  row.append(el('div', 'grow'));
  for (const a of actions) row.append(a);
  wrap.append(row);
  if (path) wrap.append(el('div', 'path', path));
  if (lede) wrap.append(el('p', 'lede', lede));
  page.append(wrap);
}

function hubLink(id, heading = '') { return location.origin + location.pathname + routeHash(id, heading); }

function copyBtn(text, label = 'copy path') {
  const b = el('button', 'btn', label);
  b.onclick = async () => { try { await navigator.clipboard.writeText(text); toast('copied ' + text); } catch { toast('copy failed'); } };
  return b;
}
async function requestOpen(id, suffix = '', button = null) {
  if (button) button.disabled = true;
  toast('sending launch request…');
  try {
    const response = await fetch('/api/open?path=' + encodeURIComponent(id) + suffix);
    if (!response.ok) throw new Error(await response.text());
    toast('launch request accepted');
  } catch (err) { toast('could not open: ' + err.message); }
  finally { if (button) button.disabled = false; }
}
function openBtn(id, label = 'open folder') {
  const b = el('button', 'btn solid', label);
  b.onclick = () => requestOpen(id, '', b);
  return b;
}
function codeBtn(id, label = 'open in VS Code') {

  b.onclick = () => requestOpen(id, '&in=code', b);
  return b;
}

/** The stat-tile strip at the top of an overview — shared by viewOverview() (scoped to
 * one project) and viewPortfolio() (the portfolio-wide numbers straight from the scan). */
function statsStrip(stats) {
  const strip = el('div', 'stats');
  for (const s of stats) {
    const c = el('div', 'stat' + (s.link ? ' jump' : ''));
    c.append(el('div', 'cap', s.label));
    const line = el('div'); line.style.cssText = 'display:flex;align-items:baseline;gap:6px';
    const b = el('b', '', String(s.value)); b.style.color = s.color;
    line.append(b, el('i', '', s.note || ''));
    c.append(line); strip.append(c);
    if (s.link) {
      c.title = `jump to ${s.link}`;
      // The "uncommitted" tile now narrows the table it jumps to; the others just jump.
      activate(c, () => {
        if (s.label === 'uncommitted' && s.value) { S.repoFilter = 'dirty'; renderView(); }
        jumpTo(s.link);
      });
    }
  }
  return strip;
}

/**
 * The sortable, filterable repos table — shared by viewOverview() (one project's own
 * repos) and viewPortfolio() (every project's, plus a project chip so a merged table
 * still says which project a row belongs to). "Show me what is dirty" is the usual
 * reason to look at this table, and until 2026-08-31 it could only be answered by
 * reading every row.
 */
function repoTableSection(repos, groups, dirtyCount, opts = {}) {
  const bar = el('div', 'filters');
  const chip = (label, on, fn) => {
    const c = el('span', 'fchip' + (on ? ' on' : ''), label);
    activate(c, fn);
    return c;
  };
  const setFilter = (v) => { S.repoFilter = S.repoFilter === v ? null : v; renderView(); };
  bar.append(chip('all', !S.repoFilter, () => { S.repoFilter = null; renderView(); }));
  if (dirtyCount) bar.append(chip(`needs attention (${dirtyCount})`, S.repoFilter === 'dirty', () => setFilter('dirty')));
  if (opts.projects) {
    for (const p of opts.projects) bar.append(chip(p, S.repoFilter === `project:${p}`, () => setFilter(`project:${p}`)));
  }
  for (const g of groups) bar.append(chip(g, S.repoFilter === g, () => setFilter(g)));

  const shown = repos.filter((r) => {
    if (!S.repoFilter) return true;
    if (S.repoFilter === 'dirty') return r.state !== 'clean';
    if (S.repoFilter.startsWith('project:')) return topAncestorOf(r.id)?.name === S.repoFilter.slice(8);
    return r.group === S.repoFilter;
  });

  // Sort keys match the column they sit under; `ago` is a human string ("3 days ago"),
  // so last-commit sorts on the order the scan returned, which is already newest-first
  // within a group -- close enough, and honest about not being a real date.
  const COLS = [['name', 'repository'], ['group', 'group'], ['branch', 'branch'], ['state', 'state'], [null, 'last commit']];
  const sorted = [...shown].sort((a, b) => {
    const k = S.repoSort.key;
    if (!k) return 0;
    return String(a[k] ?? '').localeCompare(String(b[k] ?? '')) * S.repoSort.dir;
  });

  const th = el('div', 'thead');
  for (const [key, label] of COLS) {
    const cell = el('span', key ? 'sortable' : '', label
      + (key && S.repoSort.key === key ? (S.repoSort.dir > 0 ? ' ▴' : ' ▾') : ''));
    if (key) {
      activate(cell, () => {
        S.repoSort = S.repoSort.key === key ? { key, dir: -S.repoSort.dir } : { key, dir: 1 };
        renderView();
      });
    }
    th.append(cell);
  }
  const rows = el('div'); rows.style.cssText = 'display:flex;flex-direction:column;margin-top:-9px';
  for (const r of sorted) {
    const tr = el('div', 'trow');
    const n = el('div', 'n');
    const p = el('span', 'pill'); p.style.background = r.dot;
    n.append(p, el('span', '', r.name));
    const st = el('span', 'm', r.state); st.style.color = r.dot;
    const br = el('span', 'm', r.branch); br.style.color = TINT.group;
    const cm = el('div', 'c'); cm.append(document.createTextNode(r.commit));
    if (r.ago) { const a = el('span', '', ' · ' + r.ago); a.style.color = 'var(--dimmer)'; cm.append(a); }
    tr.append(n, el('span', 'm', r.group), br, st, cm);
    activate(tr, () => go(r.id));
    rows.append(tr);
  }
  if (!sorted.length) rows.append(el('div', 'empty', 'no repos match that filter'));
  return foldable('Repos',
    sectionWith('Repos', S.repoFilter ? `${sorted.length} of ${repos.length}` : groups.join(' · '), 'sec-repos'),
    bar, th, rows);
}

// overview ------------------------------------------------------------------
function viewOverview(page, root) {
  // Everything below used to read S.data.* directly, which was fine when a hub only
  // ever held one project -- Documents/Skills/Pictures/Automations already existed as
  // separate roots before this, and silently showed this same portfolio-wide data too.
  // `inRoot` scopes every list to the root actually being viewed, via the same parent
  // chain the tree itself is built from (see topAncestorOf).
  const inRoot = (x) => topAncestorOf(x.id) === root;
  const repos = S.data.repos.filter(inRoot);
  const relevantRuntimes = S.data.runtimes.filter((r) => scopeOf(r) === 'user' || inRoot(r));
  const projectRuntimes = relevantRuntimes.filter((r) => scopeOf(r) === 'project');
  const userRuntimes = relevantRuntimes.filter((r) => scopeOf(r) === 'user');
  const totals = { skill: 0, command: 0, agent: 0, hook: 0 };
  const userTotals = { skill: 0, command: 0, agent: 0, hook: 0 };
  for (const rt of relevantRuntimes) for (const k in totals) totals[k] += rt.counts[k];
  for (const rt of userRuntimes) for (const k in userTotals) userTotals[k] += rt.counts[k];
  const mcpAll = relevantRuntimes.reduce((n, r) => n + (r.mcp || 0), 0);
  const mcpUser = userRuntimes.reduce((n, r) => n + (r.mcp || 0), 0);
  const dirtyCount = repos.filter(r => r.state !== 'clean').length;
  const conflicts = repos.filter(r => r.state === 'conflict').length;
  const groups = [...new Set(repos.map(r => r.group))];

  const CLIS = 'sec-project-clis', REPOS = 'sec-repos';
  const stats = [
    { label: 'cli runtimes', value: relevantRuntimes.length, note: `${userRuntimes.length} user`, color: TINT.cli, link: CLIS },
    { label: 'repos', value: repos.length, note: groups.length > 1 ? `${groups.length} groups` : '', color: 'var(--fg-hi)', link: REPOS },
    { label: 'skills', value: totals.skill, note: `${userTotals.skill} user`, color: TINT.skill, link: CLIS },
    { label: 'commands', value: totals.command, note: `${userTotals.command} user`, color: TINT.command, link: CLIS },
    { label: 'sub-agents', value: totals.agent, note: `${totals.hook} hooks · ${userTotals.agent} user`, color: TINT.agent, link: CLIS },
    { label: 'mcp servers', value: mcpAll, note: `${mcpUser} user`, color: TINT.mcp, link: CLIS },
    { label: 'uncommitted', value: dirtyCount, note: conflicts ? `+${conflicts} conflict` : '', color: dirtyCount ? TINT.command : TINT.cli, link: REPOS },
  ];
  const rootDocs = S.data.rootDocs.filter(d => topAncestorOf(d.id) === root);
  const liveSites = (S.data.liveSites || []).filter(s => s.project === root.name);
  const drafts = (S.data.drafts || []).filter(inRoot);

  headerBlock(page, {
    title: root.name,
    path: absOf(root.id),
    lede: `${projectRuntimes.length} project CLIs and ${userRuntimes.length} user CLIs, ${repos.length} application repos, and the skills, commands, sub-agents, hooks and MCP servers they share. Regenerated on every scan.`,
    actions: [readmeBtn(root), openBtn(root.id, 'open workspace'), codeBtn(root.id),
      copyBtn(winPath(root.id), 'copy root path')].filter(Boolean),
  });

  page.append(statsStrip(stats));

  // Straight from the root README's own "Live sites" table (parsed server-side each
  // scan) — absent entirely on projects whose workspace has no such table (Mike_IAM,
  // Mike_Finance), rather than showing an empty section.
  if (liveSites.length) {
    const cards = el('div', 'cards two');
    for (const s of liveSites) {
      const c = el('div', 'card');
      const hd = el('div', 'hd');
      const live = /live/i.test(s.status);
      const dot = el('span', 'dot'); dot.style.background = live ? 'var(--green)' : 'var(--dimmer)';
      hd.append(dot, el('b', '', s.app), el('em', '', s.status || ''));
      const detail = [s.url.replace(/^https?:\/\//, ''), s.stack].filter(Boolean).join(' · ');
      c.append(hd, el('p', '', detail));
      c.title = `open ${s.url}`;
      activate(c, () => window.open(s.url, '_blank', 'noopener,noreferrer'));
      cards.append(c);
    }
    page.append(foldable('Live Sites',
      sectionWith('Live Sites', `${liveSites.length} deployments`, 'sec-live-sites'), cards));
  }

  // Order is deliberate: the stat strip reads as a table of contents, then the three
  // sections it points at — repos (what you ship), root docs (what explains them), and
  // the agent runtimes (what builds them) last, because that block is the tallest.

  page.append(repoTableSection(repos, groups, dirtyCount));

  // Pre-repo R&D under Repos/Draft/ (#34) \u2014 no `.git`, so it never reaches `repos` above
  // and has no git state to show; a lighter card cluster instead, cardless entirely on a
  // project whose workspace has no such folder.
  if (drafts.length) {
    const cards = el('div', 'cards');
    for (const d of drafts) {
      const c = el('div', 'card');
      const dot = el('span', 'dot round'); dot.style.background = TINT.draft;
      const hd = el('div', 'hd'); hd.append(dot, el('b', '', d.name), el('em', '', 'DRAFT'));
      c.append(hd, el('p', '', d.desc || '\u2014'));
      activate(c, () => go(d.id));
      cards.append(c);
    }
    page.append(foldable('Draft Initiatives',
      sectionWith('Draft Initiatives', `${drafts.length} pre-repo`, 'sec-drafts'), cards));
  }

  // root docs
  if (rootDocs.length) {
    const docs = el('div', 'cards two');
    for (const d of rootDocs) {
      const c = el('div', 'card');
      const hd = el('div', 'hd');
      const dot = el('span', 'dot'); dot.style.background = TINT.md;
      hd.append(dot, el('b', '', d.name), el('em', '', d.where));
      c.append(hd, el('p', '', d.desc || '—'));
      activate(c, () => go(d.id));
      docs.append(c);
    }
    page.append(foldable('Readmes',
      sectionWith('Readmes', `${rootDocs.length} root docs`, 'sec-docs'), docs));
  }

  // Runtimes, split by scope. Project runtimes are per-repo config under Agents/;
  // user runtimes live in the home directory and apply to every repo on the machine.
  for (const [scope, list] of [['project', projectRuntimes], ['user', userRuntimes]]) {
    if (!list.length) continue;
    page.append(foldable(SCOPE[scope].title,
      sectionWith(SCOPE[scope].title, SCOPE[scope].where(root.name), `sec-${scope}-clis`),
      runtimeCards(list)));
  }
}

// portfolio -------------------------------------------------------------------
// The Projects folder's own view — the portfolio-wide summary across every project it
// contains. Unlike viewOverview() nothing here is scoped by root — S.data.stats/repos/
// liveSites/rootDocs already cover every project, exactly as the server built them.
function viewPortfolio(page, n) {
  const projects = n.children || [];
  headerBlock(page, {
    title: n.name,
    lede: `${projects.length} projects — ${S.data.repos.length} application repos, and the skills, commands, sub-agents, hooks and MCP servers they share across all of them. Click a project below, or in the sidebar, to see it on its own.`,
  });

  const cards = el('div', 'cards');
  for (const p of projects) {
    const c = el('div', 'card');
    const dot = el('span', 'dot round'); dot.style.background = TINT.root;
    const repoCount = S.data.repos.filter((r) => topAncestorOf(r.id) === p).length;
    const dirty = S.data.repos.filter((r) => topAncestorOf(r.id) === p && r.state !== 'clean').length;
    const hd = el('div', 'hd'); hd.append(dot, el('b', '', p.name), el('em', '', `${repoCount} repos`));
    c.append(hd, el('p', '', dirty ? `${dirty} need attention` : p.desc || 'all clean'));
    activate(c, () => go(p.id));
    cards.append(c);
  }
  page.append(foldable('Projects', sectionWith('Projects', `${projects.length}`, 'sec-projects'), cards));

  page.append(statsStrip(S.data.stats));

  if (S.data.liveSites && S.data.liveSites.length) {
    const siteCards = el('div', 'cards two');
    for (const s of S.data.liveSites) {
      const c = el('div', 'card');
      const hd = el('div', 'hd');
      const live = /live/i.test(s.status);
      const dot = el('span', 'dot'); dot.style.background = live ? 'var(--green)' : 'var(--dimmer)';
      hd.append(dot, el('b', '', s.app), el('em', '', s.project));
      const detail = [s.url.replace(/^https?:\/\//, ''), s.stack].filter(Boolean).join(' · ');
      c.append(hd, el('p', '', detail));
      c.title = `open ${s.url}`;
      activate(c, () => window.open(s.url, '_blank', 'noopener,noreferrer'));
      siteCards.append(c);
    }
    page.append(foldable('Live Sites',
      sectionWith('Live Sites', `${S.data.liveSites.length} deployments`, 'sec-live-sites'), siteCards));
  }

  const groups = [...new Set(S.data.repos.map((r) => r.group))];
  const dirtyCount = S.data.repos.filter((r) => r.state !== 'clean').length;
  page.append(repoTableSection(S.data.repos, groups, dirtyCount, { projects: projects.map((p) => p.name) }));

  if (S.data.rootDocs.length) {
    const docs = el('div', 'cards two');
    for (const d of S.data.rootDocs) {
      const c = el('div', 'card');
      const hd = el('div', 'hd');
      const dot = el('span', 'dot'); dot.style.background = TINT.md;
      hd.append(dot, el('b', '', d.name), el('em', '', d.where));
      c.append(hd, el('p', '', d.desc || '—'));
      activate(c, () => go(d.id));
      docs.append(c);
    }
    page.append(foldable('Readmes',
      sectionWith('Readmes', `${S.data.rootDocs.length} root docs`, 'sec-docs'), docs));
  }
}

/**
 * Scroll a stat tile's target section into view inside #view (the scroll container —
 * the page itself never scrolls, so an `href="#id"` would do nothing) and flash its
 * heading. Falls back to the agents block when a specific one isn't on the page.
 */
function jumpTo(id) {
  const h = document.getElementById(id) || document.getElementById('sec-project-clis');
  const v = $('#view');
  if (!h || !v) return;
  // A folded target would scroll to a heading with nothing under it.
  for (let d = h.closest('details'); d; d = d.parentElement?.closest('details')) d.open = true;
  // Scroll the container by hand rather than scrollIntoView({behavior:'smooth'}) —
  // smooth scrolling is a silent no-op under the `zoom` on :root, and the 12px of
  // headroom keeps the heading off the very top edge.
  const top = v.scrollTop + h.getBoundingClientRect().top - v.getBoundingClientRect().top - 12;
  v.scrollTop = Math.max(0, top);
  h.classList.remove('flash');
  void h.offsetWidth;            // restart the animation on a repeat click
  h.classList.add('flash');
}

// Project CLIs are per-repo config under Agents/; user CLIs live in the home
// directory and apply to every repo on the machine. Every view that lists runtimes
// labels the two the same way.
// `where` takes the current root's name — there can be several projects now, so
// "the" project root (it used to default to `S.data.roots[0]`, back when there was
// only ever one) has to come from whichever overview is actually being rendered.
const SCOPE = {
  project: { title: 'Project CLIs', where: (name) => `${name}/Agents`, tag: 'project scope' },
  user:    { title: 'User CLIs',    where: () => '~ · home directory', tag: 'user scope' },
};
const scopeOf = n => (n.scope === 'user' ? 'user' : 'project');

// Folded sections are remembered by label, not by node id -- the same section on two
// pages should agree, and a per-node set would grow without bound.
let COLLAPSED = new Set();
try { COLLAPSED = new Set(JSON.parse(localStorage.getItem('hub.collapsed') || '[]')); } catch {}
function remember(key, open) {
  open ? COLLAPSED.delete(key) : COLLAPSED.add(key);
  try { localStorage.setItem('hub.collapsed', JSON.stringify([...COLLAPSED])); } catch {}
}

/** Wrap a section heading and its blocks in a <details> that folds. */
function foldable(key, head, ...blocks) {
  const d = el('details', 'fold');
  d.open = !COLLAPSED.has(key);
  const sum = el('summary');
  sum.append(el('span', 'fchev', '\u25b8'), head);
  const body = el('div', 'foldbody');
  for (const b of blocks) if (b) body.append(b);
  d.append(sum, body);
  d.addEventListener('toggle', () => remember(key, d.open));
  return d;
}

/** A .panel that folds -- its `.ph` header row is the summary. */
function foldPanel(key, cls = 'panel') {
  const d = el('details', cls);
  d.open = !COLLAPSED.has(key);
  d.addEventListener('toggle', () => remember(key, d.open));
  return d;
}
/** The panel header row, chevron already in place. */
function phRow() {
  const s = el('summary', 'ph');
  s.append(el('span', 'fchev', '\u25b8'));
  return s;
}

/** Section heading with a dimmed right-hand note — `Project CLIs   Mikes_AI_Lab/Agents`. */
function sectionWith(title, note, id) {
  const h = el('div');
  h.style.cssText = 'display:flex;align-items:baseline;justify-content:space-between;gap:12px';
  const t = el('h2', 'sec', title);
  if (id) t.id = id;
  h.append(t);
  const nt = el('span', 'mono', note);
  nt.style.cssText = 'font-size:10.5px;color:var(--dimmer)';
  h.append(nt);
  return h;
}

function runtimeCards(list) {
  const rt = el('div', 'cards');
  for (const r of list) {
    const c = el('div', 'card');
    const hd = el('div', 'hd');
    const d = el('span', 'dot'); d.style.background = TINT.cli;
    const cfg = el('em', '', r.config || ''); cfg.style.textTransform = 'none';
    hd.append(d, el('b', '', r.name), cfg);
    c.append(hd, el('p', '', r.desc || '—'));
    // Called with both scan-payload runtimes (mcp/plugins are counts) and raw tree
    // nodes (they're arrays), so normalise rather than keeping two card renderers.
    const size = v => (Array.isArray(v) ? v.length : v || 0);
    const k = r.counts || { skill: 0, command: 0, agent: 0, hook: 0, routine: 0 };
    const ft = el('div', 'ft');
    ft.append(count(k.skill, 'skills', TINT.skill), count(k.command, 'cmds', TINT.command),
      count(k.agent, 'agents', TINT.agent), count(k.hook, 'hooks', TINT.hook),
      count(size(r.mcp), 'mcp', TINT.mcp));
    if (k.routine) ft.append(count(k.routine, 'routines', TINT.routine));
    if (size(r.plugins)) ft.append(count(size(r.plugins), 'plugins', TINT.agent));
    c.append(ft);
    activate(c, () => go(r.id));
    rt.append(c);
  }
  return rt;
}

function count(v, label, color) {
  const s = el('span');
  const b = el('span', '', String(v)); b.style.color = color;
  s.append(b, document.createTextNode(' ' + label));
  return s;
}

// cli runtime ---------------------------------------------------------------
function viewCli(page, n) {
  const tags = [el('span', 'tag cli', 'CLI runtime')];
  tags.push(el('span', 'tag br', SCOPE[scopeOf(n)].tag));
  headerBlock(page, {
    title: n.name, tags, path: absOf(n.id), lede: n.desc || '',
    actions: [copyBtn(winPath(n.id)), codeBtn(n.id), openBtn(n.id, 'open folder')],
  });

  const files = (n.children || []).filter(c => c.kind === 'md' || c.kind === 'config');
  if (files.length) {
    const chips = el('div', 'chips');
    for (const f of files) {
      const c = el('div', 'chip');
      const d = el('span', 'dot'); d.style.cssText = `background:${tintOf(f)};width:6px;height:6px;flex:0 0 6px`;
      c.append(d, el('span', '', f.name), el('em', '', fmtSize(f.size)));
      activate(c, () => go(f.id));
      chips.append(c);
    }
    page.append(chips);
  }

  page.append(bucketGrid(n, ''));

  // Project CLIs also inherit whatever the matching user-scope runtime carries
  // (skills, sub-agents, commands, hooks, MCP servers, plugins) — shown as its own
  // labeled section rather than merged into the project's, so it stays clear which
  // artifacts live in this repo vs. apply to every repo on the machine.
  if (n.scope === 'project' && n.userCli && S.byId.has(n.userCli)) {
    const u = S.byId.get(n.userCli);
    page.append(sectionWith('Inherited from user scope', `${u.name} · ~`, ''));
    const note = el('p', '', `Every project on this machine gets these from ${u.name} — edit them there, not here.`);
    note.style.cssText = 'font-size:11px;color:var(--dimmer);margin:-6px 0 10px';
    const link = el('span', '', 'open ' + u.name + ' →');
    link.style.cssText = 'margin-left:8px;color:var(--green);cursor:pointer';
    activate(link, () => go(u.id));
    note.append(link);
    page.append(note);
    page.append(bucketGrid(u, 'user:'));
  }
}

// Skills/commands/sub-agents/hooks/MCP/plugins found anywhere in a CLI runtime's
// subtree, as the folding panel grid viewCli shows for both a project runtime and,
// when there's a match, the user-scope runtime it inherits from. `keyPrefix`
// namespaces the fold-open/closed memory so the two grids don't fight over it.
function bucketGrid(n, keyPrefix) {
  const found = { skill: [], command: [], agent: [], hook: [], style: [], routine: [] };
  (function rec(list) { for (const c of list || []) { if (found[c.kind]) found[c.kind].push(c); rec(c.children); } })(n.children);
  // Hooks declared inline in settings.json's `hooks` key -- Claude Code's real
  // mechanism -- aren't files, so they never turn up in n.children above.
  if (n.hooksCfg && n.hooksCfg.length) found.hook = found.hook.concat(n.hooksCfg);

  const grid = el('div', 'buckets');
  for (const [kind, label] of [['skill', 'Skills'], ['command', 'Commands'], ['agent', 'Sub-agents'],
    ['hook', 'Hooks'], ['style', 'Output styles'], ['routine', 'Routines']]) {
    if ((kind === 'style' || kind === 'routine') && !found[kind].length) continue;
    const items = found[kind];
    const panel = foldPanel(keyPrefix + label, 'panel bucket');
    const ph = phRow();
    const d = el('span', 'dot'); d.style.background = TINT[kind];
    const dir = el('em', '', items.length ? relDir(items[0].id, n.id) : '—');
    const ct = el('em', '', String(items.length)); ct.style.color = TINT[kind];
    ph.append(d, el('b', '', label), dir, ct);
    panel.append(ph);
    if (!items.length) panel.append(el('div', 'empty', '  none found'));
    for (const it of items) {
      const row = el('div', 'bitem');
      const top = el('div'); top.style.cssText = 'display:flex;align-items:center;gap:8px';
      const label = it.title || it.name;
      const nm = el('span', 'bn', label); nm.style.color = TINT[kind]; nm.style.flex = '1';
      const tg = el('span', 'mono'); tg.style.cssText = 'font-size:9.5px;color:var(--dimmest)';
      const slug = it.name.replace(/\.md$/i, '');
      // Routines have no filename worth showing here; the schedule is the useful column.
      tg.textContent = kind === 'routine' ? (it.sched || '') : slug === label ? '' : it.name;
      top.append(nm, tg);
      row.append(top);
      if (it.desc) row.append(el('p', '', it.desc));
      activate(row, () => go(it.id));
      panel.append(row);
    }
    grid.append(panel);
  }

  // MCP servers and plugins aren't files on disk, so they're read out of the runtime's
  // config rather than walked — same panel shape, one row per entry.
  for (const [items, label, kind, srcId] of [
    [n.mcp || [], 'MCP servers', 'mcp', n.mcpFile],
    [n.plugins || [], 'Plugins', 'agent', ''],
  ]) {
    if (!items.length) continue;
    const panel = foldPanel(keyPrefix + label, 'panel bucket');
    const ph = phRow();
    const d = el('span', 'dot'); d.style.background = TINT[kind];
    const ct = el('em', '', String(items.length)); ct.style.color = TINT[kind];
    ph.append(d, el('b', '', label), el('em', '', srcId ? srcId.split('/').pop() : 'installed'), ct);
    panel.append(ph);
    for (const it of items) {
      const row = el('div', 'bitem');
      const top = el('div'); top.style.cssText = 'display:flex;align-items:center;gap:8px';
      const nm = el('span', 'bn', it.name); nm.style.color = TINT[kind]; nm.style.flex = '1';
      const tg = el('span', 'mono', it.detail || '');
      tg.style.cssText = 'font-size:9.5px;color:var(--dimmest);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      top.append(nm, tg);
      row.append(top);
      if (srcId && S.byId.has(srcId)) activate(row, () => go(srcId));
      panel.append(row);
    }
    grid.append(panel);
  }
  return grid;
}
const relDir = (childId, baseId) => {
  const rest = childId.slice(baseId.length + 1).split('/');
  return rest.slice(0, -1).join('/') || '.';
};

// folder / group / section ---------------------------------------------------
// ── folder list view (P7-09) ───────────────────────────────────────────────
// Cards are good at a dozen things with descriptions and bad at eighty files. The list
// is the other half: four columns, sortable, folders first. Which one you get is a
// per-viewer preference, so it lives in localStorage next to the theme and the rail.
let folderMode = 'cards';
try { if (localStorage.getItem('hub.folderview') === 'list') folderMode = 'list'; } catch {}
const setFolderMode = (mode) => {
  folderMode = mode;
  try { localStorage.setItem('hub.folderview', mode); } catch {}
  renderView();
};

// Modified times are fetched per folder rather than shipped with every node -- see
// folderStamps() in hub.mjs. One in-flight request per folder; the answer is cached
// until the next scan, which is when it could have changed.
const folderTimes = new Map();
let folderTimesGen = 0;

/** The folder's stamps if they are already here, otherwise null and a repaint later. */
function folderTimesFor(id, host) {
  const cached = folderTimes.get(id);
  if (cached) return cached instanceof Promise ? null : cached;
  const generation = folderTimesGen;
  const pending = fetch('/api/stat?path=' + encodeURIComponent(id))
    .then((r) => (r.ok ? r.json() : {}))
    .catch(() => ({}));
  folderTimes.set(id, pending);
  pending.then((stamps) => {
    // A scan landing between request and response invalidates the whole cache, so a
    // late reply must not repopulate it -- the same rule the Pictures cache follows.
    if (generation !== folderTimesGen) return;
    folderTimes.set(id, stamps);
    if (host.isConnected) renderView();
  });
  return null;
}

function folderList(page, n, kids) {
  const stamps = folderTimesFor(n.id, page);

  const COLS = [['name', 'name'], ['kind', 'type'], ['mtime', 'modified'], ['size', 'size']];
  const timeOf = (c) => (stamps ? stamps[c.name] || 0 : 0);
  const sizeOf = (c) => (DIRISH.has(c.kind) ? -1 : c.size || 0);
  const key = S.folderSort.key, dir = S.folderSort.dir;
  const sorted = [...kids].sort((a, b) => {
    // Folders first when sorting by name or type: it makes a long folder scannable, and
    // hiding a directory among sixty files is what the list view exists to prevent. NOT
    // when sorting by modified or size -- there the key is the whole question, and
    // burying the file you edited a minute ago under seven month-old folders is the
    // opposite of the answer.
    if (key !== 'mtime' && key !== 'size') {
      const group = (DIRISH.has(b.kind) ? 1 : 0) - (DIRISH.has(a.kind) ? 1 : 0);
      if (group) return group;
    }
    if (key === 'mtime') return (timeOf(b) - timeOf(a)) * dir;
    if (key === 'size') return (sizeOf(b) - sizeOf(a)) * dir;
    return String(a[key] ?? '').localeCompare(String(b[key] ?? '')) * dir;
  });

  const wrap = el('div', 'flist');
  const th = el('div', 'thead');
  for (const [k, label] of COLS) {
    const cell = el('span', 'sortable' + (k === 'size' ? ' s' : ''),
      label + (key === k ? (dir > 0 ? ' ▴' : ' ▾') : ''));
    activate(cell, () => {
      S.folderSort = key === k ? { key: k, dir: -dir } : { key: k, dir: 1 };
      renderView();
    });
    th.append(cell);
  }
  wrap.append(th);

  for (const c of sorted) {
    const row = el('div', 'trow');
    const name = el('div', 'n');
    const dot = el('span', 'dot' + (ROUND.has(c.kind) ? ' round' : '')); dot.style.background = tintOf(c);
    name.append(dot, el('span', '', c.name));
    // A folder's "size" is how much is in it, which is the number you actually want.
    const measure = DIRISH.has(c.kind)
      ? (c.lazy && !c.loaded ? 'unopened' : (c.children?.length ?? 0) + ' items')
      : fmtSize(c.size) || '—';
    row.append(name, el('span', 'm', KIND_LABEL[c.kind] || c.kind),
      el('span', 'm', stamps ? fmtAgo(timeOf(c)) || '—' : '…'), el('span', 's', measure));
    row.title = c.desc || c.id;
    activate(row, () => go(c.id));
    wrap.append(row);
  }
  page.append(wrap);
}

/**
 * A folder's own README as its landing page, with one button back to the view the node
 * would otherwise have got. Applies to any node the server flagged `docFirst` — the shared
 * roots and every ordinary folder that documents itself. The switch is per-node and
 * per-session (S.docOff) rather than persisted: the README is the intended default every
 * time the hub is opened fresh.
 */
function viewDocFirst(page, n) {
  const back = el('button', 'btn', n.kind === 'root' ? '\u229e overview' : '\u229e folder');
  back.title = 'Show this folder\u2019s contents instead of its README';
  back.onclick = () => { S.docOff.add(n.id); renderView(); };
  headerBlock(page, {
    title: n.name, path: absOf(n.id), lede: n.desc || '',
    actions: [back, copyBtn(winPath(n.id)), codeBtn(n.id), openBtn(n.id, 'open folder')],
  });
  const panel = foldPanel('Document');
  const ph = phRow();
  ph.append(el('span', '', n.doc.split('/').pop()), el('em', '', 'rendered'));
  panel.append(ph);
  const body = el('div', 'md'); body.textContent = 'loading\u2026';
  panel.append(body);
  loadDoc(n.doc, body);
  page.append(panel);
}

/** The return trip out of a switched-off viewDocFirst, or null for every other node. */
function readmeBtn(n) {
  if (!(n.docFirst && n.doc && S.docOff.has(n.id))) return null;
  const b = el('button', 'btn', '\u2630 readme');
  b.onclick = () => { S.docOff.delete(n.id); renderView(); };
  return b;
}

function viewFolder(page, n) {
  const toggle = el('div', 'viewtoggle');
  for (const [mode, label] of [['cards', '⊞ cards'], ['list', '☰ list']]) {
    const b = el('button', 'btn' + (folderMode === mode ? ' on' : ''), label);
    b.setAttribute('aria-pressed', String(folderMode === mode));
    b.onclick = () => setFolderMode(mode);
    toggle.append(b);
  }
  headerBlock(page, {
    title: n.name, path: absOf(n.id), lede: n.desc || '',
    actions: [readmeBtn(n), toggle, copyBtn(winPath(n.id)), codeBtn(n.id), openBtn(n.id, 'open folder')]
      .filter(Boolean),
  });
  const kids = n.children || [];
  if (!kids.length) {
    page.append(n.more ? skippedNote(n.more, '. Use open folder.') : el('div', 'empty', 'empty folder'));
    return;
  }

  // The list is deliberately flat: splitting it into titled groups is what the card
  // view is for, and the whole point of a list is one sortable sequence.
  if (folderMode === 'list') {
    folderList(page, n, kids);
    if (n.more) page.append(skippedNote(n.more, '.'));
    return;
  }

  // Agents/ and the user root both mix runtimes with ordinary folders and docs.
  // Runtimes are the reason you opened the page, so they get their own titled group
  // with the same counts the overview shows.
  const clis = kids.filter(c => c.kind === 'cli');
  const rest = kids.filter(c => c.kind !== 'cli');
  if (clis.length) {
    const scope = SCOPE[scopeOf(clis[0])];
    page.append(foldable(scope.title, sectionWith(scope.title, scope.where(topAncestorOf(n.id)?.name)), runtimeCards(clis)));
  }

  const cards = el('div', 'cards');
  for (const c of (clis.length ? rest : kids)) {
    const card = el('div', 'card');
    const hd = el('div', 'hd');
    const d = el('span', 'dot' + (ROUND.has(c.kind) ? ' round' : '')); d.style.background = tintOf(c);
    hd.append(d, el('b', '', c.name), el('em', '', KIND_LABEL[c.kind] || c.kind));
    card.append(hd);
    if (c.kind === 'image') {
      // loading="lazy" is the whole mechanism: a folder of two thousand photos fetches
      // only what is on screen, with no observer to write and none to get wrong.
      const thumb = el('img', 'thumb');
      thumb.loading = 'lazy'; thumb.decoding = 'async';
      thumb.alt = '';
      thumb.src = '/api/raw?path=' + encodeURIComponent(c.id);
      thumb.onerror = () => thumb.remove();
      card.append(thumb);
    }
    card.append(el('p', '', c.desc || (c.lazy && !c.loaded ? 'Open to load folder' : c.children ? `${c.children.length} items`
      : c.more ? `${c.more} file${c.more === 1 ? '' : 's'}` : fmtSize(c.size) || '—')));
    if (c.kind === 'repo') {
      const ft = el('div', 'ft');
      const st = el('span', '', c.state || ''); st.style.color = c.dot || 'var(--dimmer)';
      ft.append(el('span', '', c.branch || ''), st);
      card.append(ft);
    }
    activate(card, () => go(c.id));
    cards.append(card);
  }
  if (cards.children.length) {
    page.append(clis.length
      ? foldable('Folders & docs', sectionWith('Folders & docs', `${rest.length} items`), cards)
      : cards);
  }
  if (n.more) page.append(skippedNote(n.more, '.'));
}

// repo ----------------------------------------------------------------------
function viewRepo(page, n) {
  const tags = [];
  const br = el('span', 'tag br', n.branch || '—'); tags.push(br);
  const st = el('span', 'mono', n.state || ''); st.style.cssText = `font-size:10.5px;color:${n.dot}`; tags.push(st);
  headerBlock(page, {
    title: n.name, tags, path: absOf(n.id),
    actions: [copyBtn(winPath(n.id)), codeBtn(n.id), openBtn(n.id, 'open folder')],
  });

  const split = el('div', 'split');
  const doc = foldPanel('Document');
  const ph = phRow();
  ph.append(el('span', '', n.doc ? n.doc.split('/').pop() : 'no README'), el('em', '', 'rendered'));
  doc.append(ph);
  const body = el('div', 'md'); body.textContent = 'loading…';
  doc.append(body);
  if (n.doc) loadDoc(n.doc, body); else body.textContent = 'This repo has no README.md.';

  const side = el('div', 'stack');
  side.append(boxKV('Git', [
    ['group', n.group], ['branch', n.branch], ['state', n.state],
    ['last commit', n.ago || '—'], ['ahead / behind', `${n.ahead ?? 0} / ${n.behind ?? 0}`],
    ['remote', n.remote || '—'],
  ]));
  if (n.commit && n.commit !== '—') {
    const b = el('div', 'box');
    b.append(el('div', 'cap', 'Latest commit'));
    const p = el('p', ''); p.style.cssText = 'margin:0;font-size:11.5px;line-height:1.5;color:var(--fg-mid)';
    p.textContent = n.commit;
    b.append(p);
    if (n.author) { const a = el('div', 'mono'); a.style.cssText = 'font-size:10.5px;color:var(--dimmer);margin-top:6px'; a.textContent = n.author; b.append(a); }
    side.append(b);
  }
  if (n.agentDoc) {
    const b = el('div', 'box');
    b.append(el('div', 'cap', 'Agent contract'));
    const list = el('div', 'linklist');
    const d = el('div', '', n.agentDoc.split('/').pop());
    activate(d, () => go(n.agentDoc));
    list.append(d); b.append(list); side.append(b);
  }
  if (n.children?.length || n.more) { side.append(contentsBox('Contents', n)); }
  split.append(doc, side);
  page.append(split);
}

/**
 * Every indexed child of a directory node as a click-through list, plus the count of
 * source files the repo doc-filter left out so the listing never reads as complete
 * when it isn't. Clicking that line opens the real folder in the editor.
 */
function contentsBox(cap, n) {
  const b = el('div', 'box');
  b.append(el('div', 'cap', cap));
  const list = el('div', 'filelist');
  for (const c of (n.children || [])) {
    const dir = DIRISH.has(c.kind);
    const row = el('div');
    row.append(el('i', '', dir ? '▸' : '·'), el('span', '', c.name + (dir ? '/' : '')));
    activate(row, () => go(c.id));
    list.append(row);
  }
  if (n.more) {
    const m = el('div', 'more');
    m.append(el('i', '', '+'), el('span', '', `${n.more} other file${n.more === 1 ? '' : 's'} — open folder`));
    activate(m, () => fetch('/api/open?path=' + encodeURIComponent(n.id)));
    list.append(m);
  }
  b.append(list);
  return b;
}

function boxKV(cap, pairs) {
  const b = el('div', 'box');
  b.append(el('div', 'cap', cap));
  for (const [k, v] of pairs) {
    const r = el('div', 'kv');
    r.append(el('span', '', k), el('span', '', v == null || v === '' ? '—' : String(v)));
    b.append(r);
  }
  return b;
}

// entity (skill / command / sub-agent / hook) --------------------------------
function viewEntity(page, n) {
  const tag = el('span', 'tag', KIND_LABEL[n.kind]); tag.style.color = TINT[n.kind];
  headerBlock(page, {
    title: n.title || n.name.replace(/\.md$/i, ''), tags: [tag], path: absOf(n.id),
    actions: [copyBtn(winPath(n.id)), codeBtn(n.id, 'open in VS Code'), openBtn(n.id, 'open')],
  });

  if (n.kind === 'command') {
    const u = el('div');
    u.style.cssText = 'background:var(--sunken);border:1px solid var(--line-soft);padding:11px 13px;font-family:var(--mono);font-size:12.5px;color:var(--fg-mid)';
    const dollar = el('span', '', '$ '); dollar.style.color = 'var(--dimmer)';
    u.append(dollar, document.createTextNode('/' + (n.title || n.name.replace(/\.md$/i, ''))));
    page.append(u);
  }

  const split = el('div', 'split');
  const docPath = n.doc || n.id;
  const doc = foldPanel('Document');
  const ph = phRow();
  ph.append(el('span', '', docPath.split('/').pop()), el('em', '', 'rendered'));
  doc.append(ph);
  const body = el('div', 'md'); body.textContent = 'loading…';
  doc.append(body);
  loadDoc(docPath, body);

  const side = el('div', 'stack');
  side.append(n.kind === 'routine'
    ? boxKV('Schedule', [
      ['when', n.sched || '—'], ['task', n.taskName || '—'], ['runner', n.runner || '—'],
      ['target', n.target || '—'], ['branch', n.branchPrefix || '—'],
      ['runs logged', n.runs != null ? String(n.runs) : '—'], ['last run', n.lastRun || 'never'],
    ])
    : boxKV('Meta', [
      ['kind', KIND_LABEL[n.kind]], ['runtime', n.cli || '—'],
      ['file', docPath.split('/').pop()], ['size', fmtSize(n.size) || '—'],
    ]));
  if (n.kind === 'routine') {
    const jump = el('div', 'chips');
    for (const [id, label] of [[n.prompt, 'prompt.md'], [n.metaFile, (n.metaFile || '').split('/').pop()], [n.lastLog, 'latest log']]) {
      if (!id) continue;
      const c = el('div', 'chip');
      const d = el('span', 'dot'); d.style.cssText = `background:${TINT.routine};width:6px;height:6px;flex:0 0 6px`;
      c.append(d, el('span', '', label));
      activate(c, () => go(id));
      jump.append(c);
    }
    if (jump.childElementCount) side.append(jump);
  }
  if (n.desc) {
    const b = el('div', 'box');
    b.append(el('div', 'cap', 'Description'));
    const p = el('p'); p.style.cssText = 'margin:0;font-size:11.5px;line-height:1.55;color:var(--fg-mid)';
    p.textContent = n.desc;
    b.append(p); side.append(b);
  }
  split.append(doc, side);
  page.append(split);
}

// plain file ----------------------------------------------------------------
// ── reader tools (P7-12) ───────────────────────────────────────────────────
// A long README is a document, not just a file. Five small things make it read like one:
// an outline, a source toggle, copy buttons on code, a comfortable measure, and a print
// stylesheet. Width and scale are per-viewer comfort, so they persist like the theme;
// the source toggle and the outline are per-session, like the HTML preview tabs.
const READ_WIDTHS = [['full', 'none'], ['normal', '82ch'], ['narrow', '64ch']];
const READ_SCALES = [['100%', 1], ['112%', 1.12], ['125%', 1.25], ['90%', 0.9]];
const reader = { width: 0, scale: 0, outline: false };
// One key, holding two names rather than two indexes: a stored index would silently mean
// something else the moment either list changes, and index 0 is today's look either way.
try {
  const saved = JSON.parse(localStorage.getItem('hub.reader') || '{}');
  const w = READ_WIDTHS.findIndex((x) => x[0] === saved.width);
  const c = READ_SCALES.findIndex((x) => x[0] === saved.scale);
  if (w > 0) reader.width = w;
  if (c > 0) reader.scale = c;
} catch {}
function cycleReader(field, list) {
  reader[field] = (reader[field] + 1) % list.length;
  try {
    localStorage.setItem('hub.reader', JSON.stringify({
      width: READ_WIDTHS[reader.width][0], scale: READ_SCALES[reader.scale][0],
    }));
  } catch {}
  renderView();
}

/** Build the outline from what actually rendered, so it can never disagree with it. */
function buildOutline(host, into) {
  into.textContent = '';
  const heads = [...host.querySelectorAll('h1, h2, h3, h4')];
  if (!heads.length) { into.append(el('div', 'empty', 'no headings in this document')); return; }
  for (const h of heads) {
    const link = el('a', h.tagName.toLowerCase(), h.textContent);
    link.href = '#';
    link.onclick = (e) => {
      e.preventDefault();
      h.scrollIntoView({ block: 'start' });
      // Keep the address bar honest: this is the same destination a cross-document
      // heading link would reach, so leaving it out would make the two disagree.
      if (h.id && S.sel) { S.heading = h.id; const hash = routeHash(S.sel, h.id); if (location.hash !== hash) location.hash = hash; }
    };
    into.append(link);
  }
}

/** Copy buttons live on the rendered block, so they copy exactly what is on screen. */
function addCopyButtons(host) {
  for (const pre of host.querySelectorAll('pre.code')) {
    const b = el('button', 'copycode', 'copy');
    b.type = 'button';
    b.onclick = async (e) => {
      e.preventDefault(); e.stopPropagation();
      try { await navigator.clipboard.writeText(pre.querySelector('code')?.textContent ?? pre.textContent); b.textContent = 'copied'; }
      catch { b.textContent = 'failed'; }
      setTimeout(() => { b.textContent = 'copy'; }, 1200);
    };
    pre.append(b);
  }
}

function viewFile(page, n) {
  const isHtml = n.kind === 'html' || /\.html?$/i.test(n.name);
  const isPdf = n.kind === 'pdf';
  const isMd = /\.md$/i.test(n.name);
  const printable = !isPdf && !(isHtml && S.htmlMode !== 'source');

  const actions = [copyBtn(winPath(n.id)), codeBtn(n.id, 'open in VS Code'), openBtn(n.id, 'open')];
  if (printable) {
    // The print stylesheet hides every bit of chrome, so this prints the document alone.
    const p = el('button', 'btn', 'print');
    p.onclick = () => window.print();
    actions.unshift(p);
  }
  headerBlock(page, {
    title: n.name, tags: [el('span', 'mono', fmtSize(n.size))], path: absOf(n.id), actions,
  });
  const panel = foldPanel('Document');
  const ph = phRow();

  if (isHtml) {
    // .html used to only ever render as escaped source text (#31) — the more useful
    // default is a live, sandboxed render, with source one click away for anyone who
    // wants to read the markup instead. The choice is remembered for the rest of the
    // session (not persisted) rather than per file, so it stays wherever you left it.
    if (!S.htmlMode) S.htmlMode = 'preview';
    const tabs = el('div'); tabs.style.cssText = 'display:flex;gap:4px';
    const tab = (mode, label) => {
      const b = el('button', 'btn' + (S.htmlMode === mode ? ' solid' : ''), label);
      b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); S.htmlMode = mode; renderView(); };
      return b;
    };
    tabs.append(tab('preview', 'preview'), tab('source', 'source'));
    ph.append(el('span', '', n.name), tabs);
  } else if (isMd) {
    // Same shape as the HTML tabs above, plus the reading controls. Markdown is the one
    // kind where both halves are useful: the render to read, the source to copy or diff.
    if (!S.mdMode) S.mdMode = 'rendered';
    const bar = el('div', 'readerbtns');
    const btn = (label, on, fn, title) => {
      const b = el('button', 'btn' + (on ? ' solid' : ''), label);
      if (title) b.title = title;
      b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); fn(); };
      return b;
    };
    bar.append(
      btn('rendered', S.mdMode === 'rendered', () => { S.mdMode = 'rendered'; renderView(); }),
      btn('source', S.mdMode === 'source', () => { S.mdMode = 'source'; renderView(); }),
    );
    if (S.mdMode === 'rendered') {
      bar.append(
        btn('☰ outline', reader.outline, () => { reader.outline = !reader.outline; renderView(); }, 'Show the heading outline'),
        btn('↔ ' + READ_WIDTHS[reader.width][0], reader.width > 0,
          () => cycleReader('width', READ_WIDTHS), 'Reading width'),
        btn('A ' + READ_SCALES[reader.scale][0], reader.scale > 0,
          () => cycleReader('scale', READ_SCALES), 'Text size'),
      );
    }
    ph.append(el('span', '', n.name), bar);
  } else {
    ph.append(el('span', '', n.name), el('em', '', isPdf ? 'PDF preview' : 'source'));
  }
  panel.append(ph);

  if (isPdf) {
    const controls = el('div', 'row'); controls.style.padding = '10px';
    controls.append(el('span', '', 'If the PDF preview is unavailable, open or download the report.'));
    const download = el('a', 'btn', 'download PDF');
    download.href = '/api/raw?path=' + encodeURIComponent(n.id) + '&download=1';
    controls.append(openBtn(n.id, 'open PDF'), download);
    panel.append(controls);
    const frame = el('iframe');
    frame.title = n.name + ' — PDF preview';
    frame.src = '/api/raw?path=' + encodeURIComponent(n.id);
    frame.style.cssText = 'width:100%;height:72vh;border:none;display:block';
    panel.append(frame);
  } else if (isHtml && S.htmlMode === 'preview') {
    const frame = el('iframe');
    frame.src = '/api/preview?path=' + encodeURIComponent(n.id);
    frame.title = n.name;
    // No allow-same-origin: the framed page gets an opaque, unique origin with no access
    // to this page's DOM, cookies, or storage, regardless of what the artifact's own
    // script tries. allow-scripts/forms/modals/popups is what an interactive dashboard
    // actually needs to function; top-level navigation stays blocked either way.
    frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups');
    frame.style.cssText = 'width:100%;height:72vh;border:none;display:block;background:#fff';
    panel.append(frame);
  } else {
    const source = isMd && S.mdMode === 'source';
    const outline = isMd && !source && reader.outline ? el('div', 'outline') : null;
    if (outline) panel.append(outline);
    const body = el('div', 'md'); body.textContent = 'loading…';
    // Width and scale are the reader's, not the document's, so they ride on the container.
    body.style.setProperty('--read-width', READ_WIDTHS[reader.width][1]);
    body.style.setProperty('--read-scale', String(READ_SCALES[reader.scale][1]));
    panel.append(body);
    loadDoc(n.id, body, { source, outline });
  }
  page.append(panel);
}

// ── image browsing (P7-13) ─────────────────────────────────────────────────
// Zoom is per-session and shared across images: flipping through a folder at 100% should
// stay at 100%, not reset every time. `null` means fit, which is what it has always done.
let imgZoom = null;
const ZOOM_STEPS = [0.25, 0.5, 1, 2, 4];

/** The images beside this one, in tree order. Empty when the siblings are not loaded. */
function imageSiblings(id) {
  const parent = S.byId.get(S.parent.get(id) || '');
  const kids = (parent?.children || []).filter((c) => c.kind === 'image');
  return { list: kids, index: kids.findIndex((c) => c.id === id) };
}

function viewImage(page, n) {
  const { list, index } = imageSiblings(n.id);
  const step = (delta) => go(list[index + delta].id);

  const actions = [];
  if (index > 0) { const b = el('button', 'btn', '‹ prev'); b.onclick = () => step(-1); actions.push(b); }
  if (index >= 0 && index < list.length - 1) { const b = el('button', 'btn', 'next ›'); b.onclick = () => step(1); actions.push(b); }
  actions.push(copyBtn(winPath(n.id)), codeBtn(n.id, 'open in VS Code'), openBtn(n.id, 'open'));

  const tags = [el('span', 'mono', fmtSize(n.size))];
  if (index >= 0 && list.length > 1) tags.push(el('span', 'mono', `${index + 1} of ${list.length}`));
  headerBlock(page, { title: n.name, tags, path: absOf(n.id), actions });

  const panel = foldPanel('Preview');
  const ph = phRow();
  const bar = el('div', 'imgbar');
  const dims = el('span', 'dims', '');
  const zoomBtn = (label, value) => {
    const b = el('button', 'btn' + (imgZoom === value ? ' solid' : ''), label);
    b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); imgZoom = value; renderView(); };
    return b;
  };
  const nudge = (dir) => {
    const b = el('button', 'btn', dir < 0 ? '−' : '+');
    b.title = dir < 0 ? 'Zoom out' : 'Zoom in';
    b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      const at = imgZoom == null ? 2 : ZOOM_STEPS.indexOf(imgZoom);
      imgZoom = ZOOM_STEPS[Math.max(0, Math.min(ZOOM_STEPS.length - 1, (at < 0 ? 2 : at) + dir))];
      renderView();
    };
    return b;
  };
  bar.append(dims, zoomBtn('fit', null), zoomBtn('100%', 1), nudge(-1), nudge(1));
  ph.append(el('span', '', n.name), bar);
  panel.append(ph);

  const wrap = el('div', 'imgwrap' + (imgZoom == null ? ' fit' : ''));
  const img = el('img');
  img.src = '/api/raw?path=' + encodeURIComponent(n.id);
  img.alt = n.name;
  img.decoding = 'async';
  if (imgZoom != null) { img.style.width = 'auto'; img.style.zoom = String(imgZoom); }
  img.onload = () => {
    // Natural size is the honest number: it does not change with zoom or the pane width.
    dims.textContent = `${img.naturalWidth} × ${img.naturalHeight}`
      + (imgZoom == null ? '' : `  ·  ${Math.round(imgZoom * 100)}%`);
  };
  img.onerror = () => { wrap.textContent = 'could not load this image'; };
  wrap.append(img);
  panel.append(wrap);
  page.append(panel);
}

async function loadDoc(id, host, opts = {}) {
  try {
    const r = await fetch('/api/file?path=' + encodeURIComponent(id) + (opts.source ? '&raw=1' : ''));
    if (!r.ok) throw new Error(await r.text());
    const { html } = await r.json();
    host.innerHTML = html;

    // Repo-relative images only resolve through the server; absolute ones load as-is.
    for (const img of host.querySelectorAll('img')) {
      const src = img.getAttribute('src') || '';
      if (/^(https?:|data:|\/api\/)/i.test(src)) continue;
      img.src = '/api/raw?path=' + encodeURIComponent(resolveRel(id, src.split('#')[0]));
      img.onerror = () => img.replaceWith(Object.assign(document.createElement('span'),
        { className: 'imgref', textContent: `[img: ${img.getAttribute('alt') || src}]` }));
    }

    // Relative links jump inside the hub when the target is indexed.
    for (const a of host.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href') || '';
      if (/^(https?:|mailto:)/i.test(href)) { a.target = '_blank'; a.rel = 'noreferrer'; continue; }
      const target = documentTarget(id, href);
      a.onclick = (e) => {
        e.preventDefault();
        if (!target) { toast('invalid document link'); return; }
        if (S.byId.has(target.id) || pictureNodes.owns(target.id)) go(target.id, target.heading);
        else toast('not indexed: ' + target.id);
      };
    }
    addCopyButtons(host);
    if (opts.outline) buildOutline(host, opts.outline);
  } catch (e) {
    host.textContent = 'could not read this file — ' + e.message;
    if (opts.outline) opts.outline.textContent = '';
  } finally {
    if (host.isConnected) {
      if (restoreReading && restoreReading.id === S.sel) $('#view').scrollTop = restoreReading.scroll;
      else if (S.heading) {
        const target = host.querySelector('#' + CSS.escape(S.heading))
          || [...host.querySelectorAll('a[name]')].find(a => a.getAttribute('name') === S.heading);
        if (target) target.scrollIntoView({ block: 'start' });
        else if (S.sel === id) toast('anchor not found: ' + S.heading);
      }
    }
  }
}

function resolveRel(fromId, href) {
  const parts = fromId.split('/').slice(0, -1);
  for (const seg of href.split('/')) {
    if (seg === '.' || seg === '') continue;
    if (seg === '..') parts.pop(); else parts.push(decodeURIComponent(seg));
  }
  return parts.join('/');
}

// search --------------------------------------------------------------------
// `skill:kalshi` narrows to one kind. The index already carries `kind`, so this is a
// filter rather than a second search path. Plurals and the obvious short forms map too,
// because nobody remembers whether it is `cmd` or `command`.
const KIND_SCOPES = {
  cli: 'cli', repo: 'repo', repos: 'repo', skill: 'skill', skills: 'skill',
  cmd: 'command', cmds: 'command', command: 'command', commands: 'command',
  agent: 'agent', agents: 'agent', subagent: 'agent', hook: 'hook', hooks: 'hook',
  style: 'style', styles: 'style', routine: 'routine', routines: 'routine',
  mcp: 'mcp', doc: 'md', docs: 'md', md: 'md', config: 'config',
  folder: 'folder', folders: 'folder', group: 'group', section: 'section',
  pdf: 'pdf', html: 'html', image: 'image', images: 'image',
};

// The project a search launched from, if any — Documents/Skills/Pictures/Automations
// and the Projects folder itself have no single project to scope to, so the toggle
// this powers only appears when it would actually narrow something. "Is a project" is
// "its immediate parent is the Projects folder" -- the nesting itself is the marker,
// no separate flag needed.
function searchContextProject() {
  const n = S.byId.get(S.sel);
  if (!n) return null;
  const top = topAncestorOf(n.id);
  return (top && S.parent.get(top.id) === '@projects') ? top : null;
}

function viewSearch(page) {
  const typed = S.query.toLowerCase();
  const scoped = /^([a-z]+):\s*(.*)$/.exec(typed);
  const kind = scoped && KIND_SCOPES[scoped[1]] ? KIND_SCOPES[scoped[1]] : null;
  const q = kind ? scoped[2].trim() : typed;

  const ctxProject = searchContextProject();
  let pool = kind ? S.index.filter(h => h.kind === kind) : S.index;
  if (ctxProject && S.searchScoped) pool = pool.filter(h => topAncestorOf(h.id) === ctxProject);
  const ranked = (q ? pool.map(h => ({ h, score: score(h, q) })).filter(x => x.score > 0)
    : pool.map(h => ({ h, score: KIND_WEIGHT[h.kind] || 1 })))
    .sort((a, b) => b.score - a.score);
  const hits = ranked.slice(0, S.hitLimit || 200).map(x => x.h);

  const head = el('div');
  head.style.cssText = 'display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim)';
  const label = el('span', 'mono');
  label.textContent = `Showing ${hits.length} of ${ranked.length} match${ranked.length === 1 ? '' : 'es'}`
    + (kind ? ` in ${KIND_LABEL[kind] || kind}` : '')
    + (q ? ` for “${q}”` : '')
    + (hits.length ? ' — ↑↓ to move, Enter to open' : '');
  head.append(label);
  if (ctxProject) {
    const toggle = el('span', 'fchip' + (S.searchScoped ? ' on' : ''), `only ${ctxProject.name}`);
    activate(toggle, () => { S.searchScoped = !S.searchScoped; syncSearchRoute(true); renderView(); });
    head.append(toggle);
  }
  page.append(head);

  const list = el('div');
  list.id = 'search-results';
  list.setAttribute('role', 'listbox');
  list.setAttribute('aria-label', 'Search results');
  for (const h of hits) {
    const row = el('div', 'hit');
    const k = el('span', 'k', KIND_LABEL[h.kind] || h.kind); k.style.color = TINT[h.kind] || TINT.file;
    const name = el('span', 'n'); name.append(mark(h.name, q));
    row.append(k, name, el('span', 'd', h.id + (h.desc ? ' — ' + h.desc : '')));
    row.title = h.id;
    activate(row, () => go(h.id), 'option');
    list.append(row);
  }
  if (!hits.length) {
    list.append(el('div', 'empty', kind ? `no ${KIND_LABEL[kind] || kind} matched` : 'nothing matched'));
  }
  page.append(list);
  if (hits.length < ranked.length) {
    const more = el('button', 'btn', 'Load 200 more');
    more.onclick = () => { const scroll = $('#view').scrollTop; S.hitLimit = (S.hitLimit || 200) + 200; syncSearchRoute(true); renderView(); $('#view').scrollTop = scroll; };
    page.append(more);
  }
  if ((!ctxProject || !S.searchScoped) && (!kind || ['image', 'pdf', 'html', 'md', 'config', 'folder'].includes(kind))) {
    const pictures = el('section'); page.append(pictures);
    searchPictures(pictures, q, kind);
  }

}

async function searchPictures(host, q, kind, previous = [], previousVersion = null) {
  const generation = pictureGeneration;
  if (!previous.length) host.textContent = 'Searching Pictures… Results load separately from project documents.';
  const key = JSON.stringify([q, kind, previous.length]);
  try {
    if (!pictureSearches.has(key)) {
      if (pictureSearches.size >= 30) pictureSearches.delete(pictureSearches.keys().next().value);
      pictureSearches.set(key, (async () => {
        let response;
        const url = '/api/pictures?action=search&q=' + encodeURIComponent(q) + '&kind=' + encodeURIComponent(kind || '') + '&offset=' + previous.length;
        for (let attempt = 0; attempt < 2; attempt++) { response = await fetch(url); if (response.status !== 409) break; }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Pictures search unavailable');
        return data;
      })());
    }
    const data = await pictureSearches.get(key);
    if (!host.isConnected || generation !== pictureGeneration) return;
    if (previousVersion && data.version !== previousVersion) {
      pictureSearches.clear(); return searchPictures(host, q, kind);
    }
    const hits = [...previous, ...data.hits];
    host.textContent = '';
    host.append(el('h2', 'sec', 'Pictures — showing ' + hits.length + ' of ' + data.total + ' matches'));
    if (data.depthLimited) host.append(el('p', 'lede', 'Search uses the existing library depth limit. Deeper folders can still be opened in the tree.'));
    if (data.readErrors) host.append(el('p', 'lede', data.readErrors + ' Pictures folders could not be read; results may be incomplete.'));
    const list = el('div'); list.id = 'pictures-results'; list.setAttribute('role', 'listbox'); list.setAttribute('aria-label', 'Pictures results');
    for (const hit of hits) {
      const row = el('div', 'hit');
      row.append(el('span', 'k', KIND_LABEL[hit.kind] || hit.kind), el('span', 'n', hit.name), el('span', 'd', hit.id));
      activate(row, () => go(hit.id), 'option'); list.append(row);
    }
    host.append(list);
    // Late arrivals extend the arrow-key sequence, so the ids and selected state
    // have to be reassigned across both lists.
    syncCombobox();
    if (hits.length < data.total) {
      const more = el('button', 'btn', 'Load 200 more Pictures results');
      more.onclick = () => { more.disabled = true; searchPictures(host, q, kind, hits, data.version); };
      host.append(more);
    }
  } catch (err) {
    pictureSearches.delete(key);
    if (!host.isConnected) return;
    host.textContent = err.message + ' ';
    const retry = el('button', 'btn', 'Retry Pictures search'); retry.onclick = () => searchPictures(host, q, kind);
    host.append(retry);
  }
}

const KIND_WEIGHT = { cli: 60, repo: 50, skill: 45, command: 45, agent: 45, routine: 45, hook: 40, style: 40, group: 35, section: 35, userroot: 35, md: 25, folder: 15, config: 10 };
function score(h, q) {
  const name = h.name.toLowerCase();
  let s = 0;
  if (name === q) s = 1000;
  else if (name.startsWith(q)) s = 600;
  else if (name.includes(q)) s = 400;
  else if ((h.desc || '').toLowerCase().includes(q)) s = 150;
  else if (h.id.toLowerCase().includes(q)) s = 60;
  return s ? s + (KIND_WEIGHT[h.kind] || 0) : 0;
}

// ── live updates ───────────────────────────────────────────────────────────
function refreshPictures() {
  pictureGeneration++; navigationRequest++;
  const destination = requestedNavigation && pictureNodes.owns(requestedNavigation.id) ? requestedNavigation : { id: S.sel, heading: S.heading };
  const selected = destination.id;
  const wasSelected = pictureNodes.owns(selected || '');
  const wasExpanded = S.open.has(pictureNodes.rootId);
  pictureNodes.clear(); pictureSearches.clear(); pictureRequests.clear();
  if (!S.data) return;
  for (const id of S.open) if (pictureNodes.owns(id)) S.open.delete(id);
  reindex(S.data);
  if (S.query) {
    renderTree(); renderPins(); renderView();
    if (wasSelected) ensurePicture(selected).catch(() => {});
  }
  else if (wasSelected) go(selected, destination.heading);
  else if (wasExpanded) toggleFolder(pictureNodes.rootId);
  else { renderTree(); renderPins(); }
}

function watch() {
  const es = new EventSource('/api/events');
  let opened = false;
  es.addEventListener('pictures', refreshPictures);
  es.addEventListener('change', () => { $('#live').classList.add('stale'); $('#live').textContent = '● changed — rescanning'; load({ quiet: true }); });
  es.onerror = () => { $('#live').classList.add('stale'); $('#live').textContent = '● disconnected'; if (S.data) { $('#connection').hidden = false; $('#connection span').textContent = 'Connection lost. Your current page is retained; reconnecting automatically.'; } };
  // Reconnecting means the server we were talking to went away -- almost always a
  // restart, which is exactly when the payload has changed and no `change` event will
  // ever fire for it. Without this refetch a tab open across a restart shows the old
  // tree indefinitely, with a healthy-looking status line. load() compares `sig`, so
  // this costs nothing when the scan really is unchanged.
  es.onopen = () => { $('#live').classList.remove('stale'); if (opened) refreshPictures(); opened = true; load({ quiet: true }); };
}

renderPins();
await load();
// Subscribe even if startup failed, so an eventual server restart can recover the page.
if (location.protocol !== 'file:' && location.port === HUB_PORT) watch();
</script>
